syntax = "proto3";

option go_package = "github.com/gayratovoyatulloh/billiard-bot-proto/user/v1;userpb";


service UserService {
  rpc Register(RegisterRequest) returns (UserResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc UpdateUser(User) returns (UserResponse);
  rpc DeleteUser(GetUserRequest) returns (UserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
}

message RegisterRequest {
  int64 telegram_id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
}

message GetUserRequest {
  int64 user_id = 1;
}

message User {
  int64 id = 1;
  int64 telegram_id = 2;
  string username = 3;
  string first_name = 4;
  string last_name = 5;
  string role = 6;
  int32 rating = 7;
}

message UserResponse {
  User user = 1;
}

message GetUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}