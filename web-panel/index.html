<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 Billiard King — Turnirlar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06060e;color:#e0e0f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* HEADER */
.hdr{
  background:linear-gradient(135deg,#0b0b1e,#0f0f28,#0b0b1e);
  border-bottom:2px solid #d4a012;
  padding:18px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{font-size:2rem;filter:drop-shadow(0 0 12px rgba(240,192,48,.5))}
.logo-text h1{font-size:1.4rem;font-weight:800;color:#f0c030;letter-spacing:.5px}
.logo-text p{font-size:.72rem;color:#5050a0;text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.hdr-right{font-size:.75rem;color:#404080}

/* MAIN */
.main{max-width:960px;margin:0 auto;padding:28px 20px 60px}

/* SECTION */
.section-title{
  font-size:.65rem;text-transform:uppercase;letter-spacing:3px;color:#404080;
  margin-bottom:14px;margin-top:32px;
  display:flex;align-items:center;gap:10px;
}
.section-title::after{content:'';flex:1;height:1px;background:#1a1a38}
.section-title:first-child{margin-top:0}

/* TOURNAMENT CARD */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

.card{
  border-radius:14px;border:1px solid #1a1a38;
  background:linear-gradient(160deg,#0d0d22,#0a0a1a);
  padding:18px 20px;
  cursor:pointer;
  transition:border-color .2s,box-shadow .2s,transform .15s;
  text-decoration:none;color:inherit;display:block;
}
.card:hover{
  border-color:#d4a012;
  box-shadow:0 0 24px rgba(212,160,18,.2);
  transform:translateY(-2px);
}
.card.active{border-color:#2a4a2a}
.card.finished{opacity:.65}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-name{font-size:1rem;font-weight:700;color:#e0e0f0;line-height:1.3}
.status-badge{
  flex-shrink:0;font-size:.65rem;padding:3px 9px;border-radius:10px;font-weight:600;
  white-space:nowrap;letter-spacing:.5px;
}
.badge-reg{background:rgba(48,180,48,.12);border:1px solid rgba(48,180,48,.3);color:#40c040}
.badge-live{background:rgba(212,160,18,.15);border:1px solid rgba(212,160,18,.4);color:#f0c030;animation:pulse-b 1.5s infinite}
.badge-done{background:rgba(80,80,160,.12);border:1px solid rgba(80,80,160,.3);color:#8080c0}
.badge-cancel{background:rgba(160,40,40,.1);border:1px solid rgba(160,40,40,.25);color:#c06060}
@keyframes pulse-b{0%,100%{opacity:1}50%{opacity:.6}}

.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.meta-tag{
  font-size:.72rem;color:#5050a0;background:rgba(255,255,255,.04);
  border-radius:5px;padding:2px 8px;
}

.card-footer{display:flex;align-items:center;justify-content:space-between}
.players-bar{flex:1;margin-right:12px}
.players-label{font-size:.68rem;color:#404070;margin-bottom:4px}
.bar-track{height:4px;background:#111128;border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#2a4a8a,#d4a012);border-radius:2px;transition:width .4s}
.players-count{font-size:.72rem;color:#6060a0}
.arrow{color:#303060;font-size:.9rem;flex-shrink:0}
.card:hover .arrow{color:#d4a012}

/* EMPTY */
.empty{text-align:center;color:#282858;padding:40px 20px;font-size:.9rem}
.empty .big{font-size:2.5rem;display:block;margin-bottom:8px;opacity:.4}

/* LOADING */
.loader{display:flex;align-items:center;justify-content:center;padding:60px;gap:12px;color:#303060}
.spin{width:28px;height:28px;border:2px solid #1a1a38;border-top-color:#d4a012;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOTER */
.foot{
  position:fixed;bottom:0;left:0;right:0;
  background:#04040c;border-top:1px solid #0e0e20;
  padding:7px 22px;display:flex;justify-content:space-between;
  font-size:.68rem;color:#282850;
}

/* MOBILE */
@media(max-width:600px){
  .hdr{padding:14px 16px}
  .main{padding:20px 14px 60px}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <span class="logo-icon">🎱</span>
    <div class="logo-text">
      <h1>Billiard King</h1>
      <p>Turnirlar</p>
    </div>
  </div>
  <div class="hdr-right" id="upd">—</div>
</header>

<main class="main" id="main">
  <div class="loader"><div class="spin"></div>Yuklanmoqda…</div>
</main>

<footer class="foot">
  <span>billiardking.uz</span>
  <span>🎱 Billiard King</span>
</footer>

<script>
const API = '/api';

async function load() {
  try {
    const r = await fetch(API + '/tournaments');
    if (!r.ok) throw new Error(r.status);
    const all = await r.json() || [];
    render(all);
    document.getElementById('upd').textContent =
      'Yangilandi: ' + new Date().toLocaleTimeString('uz-UZ');
  } catch(e) {
    document.getElementById('main').innerHTML =
      '<div class="empty"><span class="big">⚠️</span>Serverga ulanib bo\'lmadi</div>';
  }
}

function render(all) {
  const active   = all.filter(t => t.status === 'registration' || t.status === 'in_progress');
  const finished = all.filter(t => t.status === 'finished' || t.status === 'cancelled');
  active.sort((a,b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
  finished.sort((a,b) => new Date(b.scheduled_at) - new Date(a.scheduled_at));

  const main = document.getElementById('main');
  main.innerHTML = '';

  if (!all.length) {
    main.innerHTML = '<div class="empty"><span class="big">🏆</span>Hozircha turnirlar yo\'q</div>';
    return;
  }

  if (active.length) {
    main.appendChild(mkSection('⚡ Faol turnirlar'));
    main.appendChild(mkCards(active));
  }

  if (finished.length) {
    main.appendChild(mkSection('📋 Turnirlar tarixi'));
    main.appendChild(mkCards(finished));
  }
}

function mkSection(title) {
  const d = document.createElement('div');
  d.className = 'section-title';
  d.textContent = title;
  return d;
}

function mkCards(list) {
  const grid = document.createElement('div');
  grid.className = 'cards';
  for (const t of list) grid.appendChild(mkCard(t));
  return grid;
}

function mkCard(t) {
  const a = document.createElement('a');
  a.href = '/tournament.html?id=' + t.id;
  const isActive = t.status === 'registration' || t.status === 'in_progress';
  a.className = 'card' + (isActive ? ' active' : ' finished');

  const pct = t.max_players > 0
    ? Math.min(100, Math.round((t.approved_count / t.max_players) * 100))
    : 0;

  a.innerHTML =
    '<div class="card-top">' +
      '<div class="card-name">' + esc(t.name) + '</div>' +
      statusBadge(t.status) +
    '</div>' +
    '<div class="card-meta">' +
      (t.branch_name ? '<span class="meta-tag">📍 ' + esc(t.branch_name) + '</span>' : '') +
      '<span class="meta-tag">📅 ' + fmtDate(t.scheduled_at) + '</span>' +
      '<span class="meta-tag">' + typeIcon(t.type) + ' ' + typeName(t.type) + '</span>' +
    '</div>' +
    '<div class="card-footer">' +
      '<div class="players-bar">' +
        '<div class="players-label">O\'yinchilar</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<span class="players-count">' + (t.approved_count||0) + '/' + (t.max_players||0) + '</span>' +
      '<span class="arrow">›</span>' +
    '</div>';
  return a;
}

function statusBadge(s) {
  const m = {
    registration: ['badge-reg',  "📋 Ro'yxat"],
    in_progress:  ['badge-live', '⚡ Jarayonda'],
    finished:     ['badge-done', '🏆 Yakunlandi'],
    cancelled:    ['badge-cancel','❌ Bekor'],
  };
  const [cls, lbl] = m[s] || ['badge-done', s];
  return '<span class="status-badge ' + cls + '">' + lbl + '</span>';
}

function typeIcon(t) {
  return {single_elimination:'🎯',double_elimination:'🔄',round_robin:'🔁'}[t]||'🏆';
}
function typeName(t) {
  return {single_elimination:'Single',double_elimination:'Double',round_robin:'Round Robin'}[t]||t||'';
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
