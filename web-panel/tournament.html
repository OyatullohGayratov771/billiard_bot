<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billiard King — Bracket</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#d4a012;--gold-light:#f0c030;--gold-dim:#8b6910;
  --felt:#1a4a22;--felt-dim:rgba(26,74,34,.18);
  --bg:#06090a;--bg2:#0a0f0b;--card-bg:rgba(10,16,11,.97);
  --border:#1a2a1c;--border-gold:rgba(212,160,18,.3);
  --text:#dde8d8;--text-dim:#4a5e4a;--text-muted:#28382a;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:auto;
  background-image:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(26,74,34,.1),transparent)}

/* ── HEADER ── */
.hdr{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#040b05 0%,#060d07 60%,var(--bg) 100%);
  border-bottom:1px solid var(--border);
  padding:14px 22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.hdr::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(212,160,18,.03) 50%,transparent);pointer-events:none}
.back-btn{
  display:flex;align-items:center;gap:6px;
  color:var(--text-dim);font-size:.8rem;text-decoration:none;
  border:1px solid var(--border);border-radius:8px;padding:7px 12px;
  transition:border-color .2s,color .2s;flex-shrink:0;background:rgba(0,0,0,.2);
}
.back-btn:hover{border-color:var(--border-gold);color:var(--gold)}
.hdr-info{flex:1;min-width:0}
.hdr-info h1{
  font-size:clamp(1rem,3vw,1.55rem);font-weight:900;letter-spacing:.5px;
  background:linear-gradient(135deg,#f0c030,#d4a012 60%,#a07010);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hdr-info .meta{font-size:.73rem;color:var(--text-dim);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap}
.hdr-info .meta span{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:4px;padding:1px 7px}
.type-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(212,160,18,.08);border:1px solid rgba(212,160,18,.2);border-radius:8px;padding:3px 10px;font-size:.68rem;color:var(--gold);margin-top:6px;width:fit-content}
.live-badge{display:flex;align-items:center;gap:7px;border-radius:20px;padding:7px 14px;font-size:.73rem;white-space:nowrap;border:1px solid rgba(30,160,60,.4);background:rgba(10,30,14,.8);color:#30c060;flex-shrink:0;font-weight:700;letter-spacing:.5px}
.dot{width:7px;height:7px;border-radius:50%;background:#30c060;animation:pulse 1.4s infinite;box-shadow:0 0 8px #30c060}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

/* ── GOLD DIVIDER ── */
.divider{height:2px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold-light) 50%,var(--gold) 70%,transparent);opacity:.5}

/* ── SECTIONS ── */
.sec-wrap{padding:0 0 24px}
.sec-hdr{display:flex;align-items:center;gap:12px;padding:18px 22px 10px;font-size:.66rem;text-transform:uppercase;letter-spacing:2.5px;font-weight:700}
.sec-hdr::after{content:'';flex:1;height:1px;background:currentColor;opacity:.12}
.sec-hdr.wb{color:#c0a000}
.sec-hdr.lb{color:#4a80c0}
.sec-hdr.gf{color:#c04080}
.sec-hdr.rr{color:#40a060}

/* ── BRACKET ── */
.bracket{display:flex;align-items:stretch;padding:8px 22px 0;overflow-x:auto;gap:0}
.round-col{display:flex;flex-direction:column;align-items:center;min-width:215px}
.round-lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);margin-bottom:10px;text-align:center;padding:3px 10px;border-radius:4px;background:rgba(26,74,34,.1);border:1px solid rgba(26,74,34,.2)}
.matches-col{display:flex;flex-direction:column;width:100%;flex:1}
.match-slot{display:flex;align-items:center;flex:1;min-height:72px}
.conn{display:flex;flex-direction:column;justify-content:center;width:28px;flex-shrink:0;align-self:stretch}
.conn-line{border-top:1px solid rgba(26,74,34,.35);width:100%}

/* ── MATCH CARD ── */
.mcard{
  width:200px;border-radius:10px;overflow:hidden;
  border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(10,18,11,.98),rgba(6,10,7,.98));
  transition:box-shadow .25s,border-color .25s;
}
.mcard.live{
  border-color:var(--gold-dim);
  box-shadow:0 0 16px rgba(212,160,18,.22);
  animation:cglow 2.2s ease-in-out infinite;
}
.mcard.done{border-color:rgba(26,74,34,.35);background:linear-gradient(160deg,rgba(10,20,12,.98),rgba(6,12,8,.98))}
@keyframes cglow{0%,100%{box-shadow:0 0 16px rgba(212,160,18,.22)}50%{box-shadow:0 0 30px rgba(212,160,18,.45)}}
.player{padding:9px 12px;font-size:.84rem;font-weight:500;display:flex;align-items:center;gap:8px}
.player+.player{border-top:1px solid rgba(255,255,255,.04)}
.player.win{background:rgba(212,160,18,.12);color:var(--gold-light);font-weight:700}
.player.lose{color:var(--text-muted)}
.ico{width:16px;text-align:center;font-size:.7rem;flex-shrink:0}
.pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:155px}
.bye-el{width:200px;padding:12px 14px;border-radius:10px;border:1px dashed rgba(26,74,34,.3);background:rgba(6,10,7,.8);color:var(--text-muted);font-size:.76rem;font-style:italic}
.void-el{width:200px;height:64px}

/* ── WINNER ── */
.winner-col{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:140px;flex:1;gap:8px;padding:20px}
.trophy{font-size:3.6rem;animation:tfloat 3s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(240,192,48,.55))}
.winner-name{font-size:1.2rem;font-weight:900;text-align:center;
  background:linear-gradient(135deg,#f0c030,#d4a012);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.winner-sub{font-size:.6rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:3px}
@keyframes tfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ── GRAND FINAL ── */
.gf-wrap{display:flex;align-items:center;justify-content:center;padding:16px 22px 36px;gap:20px;flex-wrap:wrap}
.gf-lbl{font-size:.63rem;text-transform:uppercase;letter-spacing:2px;color:#c04080;margin-bottom:8px;text-align:center}

/* ── ROUND ROBIN ── */
.rr-wrap{display:grid;grid-template-columns:1fr 270px;gap:20px;padding:10px 22px 40px}
@media(max-width:760px){.rr-wrap{grid-template-columns:1fr}}
.rr-matches{display:flex;flex-direction:column;gap:7px}
.rr-card{border-radius:10px;border:1px solid var(--border);background:linear-gradient(160deg,rgba(10,18,11,.98),rgba(6,10,7,.98));padding:10px 14px;display:flex;align-items:center;gap:10px;transition:border-color .2s}
.rr-card.live{border-color:var(--gold-dim);animation:cglow 2.2s ease-in-out infinite}
.rr-card.done{border-color:rgba(26,74,34,.3);background:linear-gradient(160deg,rgba(10,20,12,.98),rgba(6,12,8,.98))}
.rr-num{font-size:.63rem;color:var(--text-muted);min-width:22px;text-align:right}
.rr-vs{color:var(--text-muted);font-size:.75rem;margin:0 6px}
.rr-p{font-size:.84rem;font-weight:500}
.rr-p.win{color:var(--gold-light);font-weight:700}
.rr-p.lose{color:var(--text-muted)}
.rr-status{margin-left:auto;font-size:.75rem}

.standings{border-radius:12px;border:1px solid var(--border);background:linear-gradient(160deg,rgba(10,18,11,.98),rgba(6,10,7,.98));overflow:hidden;height:fit-content}
.st-hdr{padding:11px 16px;font-size:.63rem;text-transform:uppercase;letter-spacing:2.5px;color:var(--text-dim);border-bottom:1px solid var(--border);background:rgba(26,74,34,.08)}
.s-row{display:grid;grid-template-columns:26px 1fr 32px 32px 32px;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid rgba(255,255,255,.03);font-size:.83rem}
.s-row:last-child{border-bottom:none}
.s-row.first{background:rgba(212,160,18,.06)}
.s-row.first .s-name{color:var(--gold-light);font-weight:700}
.s-rank{color:var(--text-muted);font-weight:700;font-size:.72rem}
.s-rank.r1{color:#f0c030}.s-rank.r2{color:#b0b0b0}.s-rank.r3{color:#c08060}
.s-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-num{text-align:center;color:var(--text-dim);font-size:.78rem}
.s-num.w{color:#30c060;font-weight:700}

/* ── EMPTY / OVERLAY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:12px;color:var(--text-muted);font-size:.9rem;text-align:center;padding:40px}
.empty .big{font-size:2.8rem;opacity:.35}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.overlay.on{opacity:1}
.spinner{width:38px;height:38px;border:3px solid rgba(26,74,34,.3);border-top-color:var(--gold);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── FOOTER ── */
.foot{position:fixed;bottom:0;left:0;right:0;background:rgba(4,7,4,.96);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:6px 22px;display:flex;justify-content:space-between;align-items:center;font-size:.68rem;color:var(--text-muted)}
.foot-logo{display:flex;align-items:center;gap:5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-dim);font-size:.65rem}

/* ── MOBILE ── */
@media(max-width:700px){
  .bracket{flex-direction:column;padding:8px 12px 0}
  .round-col{min-width:unset;width:100%}
  .matches-col{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:8px}
  .match-slot{flex-shrink:0}
  .conn{display:none}
  .sec-hdr{padding:12px 14px 8px}
  .gf-wrap{padding:12px 14px 36px}
}
</style>
</head>
<body>

<div class="overlay" id="ov"><div class="spinner"></div></div>

<header class="hdr">
  <a class="back-btn" href="/">‹ Turnirlar</a>
  <div class="hdr-info">
    <h1 id="tname">Yuklanmoqda…</h1>
    <div class="meta" id="tmeta"></div>
    <div id="ttype" class="type-pill" style="display:none"></div>
  </div>
  <div class="live-badge" id="live-badge" style="display:none">
    <span class="dot"></span><span>JONLI</span>
  </div>
</header>
<div class="divider"></div>

<div id="main">
  <div class="empty"><div class="big">⏳</div><div>Yuklanmoqda…</div></div>
</div>

<footer class="foot">
  <span id="upd">—</span>
  <div class="foot-logo">🎱 Billiard King</div>
</footer>

<script>
const API = '/api';
const params = new URLSearchParams(location.search);
const TRN_ID = params.get('id');
if (!TRN_ID) location.href = '/';

async function loadData() {
  const ov = document.getElementById('ov');
  ov.className = 'overlay on';
  try {
    const [tRes, bRes] = await Promise.all([
      fetch(API + '/tournaments/' + TRN_ID),
      fetch(API + '/tournaments/' + TRN_ID + '/bracket'),
    ]);
    if (!tRes.ok) throw new Error('not found');
    const tournament = await tRes.json();
    const matches = bRes.ok ? (await bRes.json() || []) : [];
    render({ tournament, matches });
    document.getElementById('upd').textContent =
      'Yangilandi: ' + new Date().toLocaleTimeString('uz-UZ');
  } catch(e) {
    document.getElementById('main').innerHTML =
      '<div class="empty"><div class="big">⚠️</div><div>Turnir topilmadi</div></div>';
  } finally {
    ov.className = 'overlay';
  }
}

// SSE — bot natija kiritganda server darhol xabar yuboradi
let _retryMs = 2000, _sse = null, _sseOk = false;
function connectSSE() {
  if (_sse) { _sse.close(); _sse = null; }
  _sse = new EventSource(API + '/tournaments/' + TRN_ID + '/sse');
  _sse.onopen = () => { _retryMs = 2000; _sseOk = true; };
  _sse.onmessage = e => {
    try { const msg = JSON.parse(e.data); if (msg.type === 'refresh') loadData(); } catch(x) {}
  };
  _sse.onerror = () => {
    _sseOk = false;
    _sse.close(); _sse = null;
    setTimeout(connectSSE, _retryMs);
    _retryMs = Math.min(_retryMs * 2, 30000);
  };
}


function render(data) {
  const t = data.tournament || {};
  const matches = data.matches || [];

  document.title = '🏆 ' + (t.name || 'Bracket') + ' — Billiard King';
  document.getElementById('tname').textContent = t.name || '—';

  const meta = document.getElementById('tmeta');
  meta.innerHTML = '';
  if (t.branch_name) addSpan(meta, '📍 ' + t.branch_name);
  if (t.scheduled_at) addSpan(meta, '📅 ' + fmtDate(t.scheduled_at));
  addSpan(meta, statusLabel(t.status));
  if (t.approved_count != null) addSpan(meta, '👥 ' + t.approved_count + '/' + t.max_players);

  const tp = document.getElementById('ttype');
  const tl = typeLabel(t.type);
  if (tl) { tp.textContent = tl; tp.style.display = 'inline-flex'; }

  document.getElementById('live-badge').style.display = t.status === 'in_progress' ? 'flex' : 'none';

  const main = document.getElementById('main');
  main.innerHTML = '';

  if (!matches.length) {
    main.innerHTML = '<div class="empty"><div class="big">⏳</div><div>Bracket hali yaratilmagan</div></div>';
    return;
  }

  if (t.type === 'double_elimination') renderDE(main, t, matches);
  else if (t.type === 'round_robin')   renderRR(main, t, matches);
  else                                 renderSE(main, t, matches);
}

function addSpan(parent, text) {
  const s = document.createElement('span');
  s.textContent = text;
  parent.appendChild(s);
}

/* ── SINGLE ELIMINATION ── */
function renderSE(container, t, matches) {
  const rounds = groupByRound(matches);
  const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  if (!nums.length) return;
  const maxR = nums[nums.length-1];
  let winner = null;
  if (t.status === 'finished')
    for (const m of rounds[maxR]||[])
      if (m.status==='done'&&m.winner_name) winner = m.winner_name;

  const br = mkBracket();
  nums.forEach((r,i) => {
    if (i>0) br.appendChild(mkConn());
    br.appendChild(mkRoundCol(rounds[r], r===maxR?'Final':r+'-bosqich', r));
  });
  if (t.status === 'finished') { br.appendChild(mkConn()); br.appendChild(mkWinner(winner)); }
  container.appendChild(br);
}

/* ── DOUBLE ELIMINATION ── */
function renderDE(container, t, matches) {
  const wb = matches.filter(m=>m.match_type==='winners');
  const lb = matches.filter(m=>m.match_type==='losers');
  const gf = matches.filter(m=>m.match_type==='grand_final');

  if (wb.length) {
    const sec = mkSec('🏆 Winners Bracket','wb');
    const rounds = groupByRound(wb);
    const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    const maxR = nums[nums.length-1];
    const br = mkBracket();
    nums.forEach((r,i) => {
      if (i>0) br.appendChild(mkConn());
      br.appendChild(mkRoundCol(rounds[r], r===maxR?'WB Final':'WB R'+r, r));
    });
    sec.appendChild(br); container.appendChild(sec);
  }
  if (lb.length) {
    const sec = mkSec('⬇ Losers Bracket','lb');
    const rounds = groupByRound(lb);
    const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    const maxR = nums[nums.length-1];
    const br = mkBracket();
    nums.forEach((r,i) => {
      if (i>0) br.appendChild(mkConn());
      const lbR = r - 1000;
      br.appendChild(mkRoundCol(rounds[r], r===maxR?'LB Final':'LB R'+lbR, r));
    });
    sec.appendChild(br); container.appendChild(sec);
  }
  if (gf.length) {
    const sec = mkSec('🎯 Grand Final','gf');
    const wrap = document.createElement('div');
    wrap.className = 'gf-wrap';
    for (const m of gf) {
      const col = document.createElement('div');
      const lbl = document.createElement('div');
      lbl.className = 'gf-lbl'; lbl.textContent = 'Grand Final';
      col.appendChild(lbl); col.appendChild(buildCard(m));
      wrap.appendChild(col);
    }
    if (t.status==='finished') {
      let winner=null;
      for (const m of gf) if (m.status==='done'&&m.winner_name) winner=m.winner_name;
      wrap.appendChild(mkConn()); wrap.appendChild(mkWinner(winner));
    }
    sec.appendChild(wrap); container.appendChild(sec);
  }
  if (!wb.length&&!lb.length&&!gf.length) renderSE(container,t,matches);
}

/* ── ROUND ROBIN ── */
function renderRR(container, t, matches) {
  const wrap = document.createElement('div');
  wrap.className = 'rr-wrap';

  const mList = document.createElement('div');
  mList.className = 'rr-matches';
  const hdr = document.createElement('div');
  hdr.className = 'sec-hdr rr'; hdr.textContent = "O'yinlar";
  mList.appendChild(hdr);

  matches.forEach((m,i) => {
    const card = document.createElement('div');
    card.className = 'rr-card'+(m.status==='ready'?' live':m.status==='done'?' done':'');
    const done = m.status==='done';
    const p1win = done&&m.winner_tg_id!=null&&m.winner_tg_id===m.player1_tg_id;
    const p2win = done&&m.winner_tg_id!=null&&m.winner_tg_id===m.player2_tg_id;

    card.innerHTML =
      '<span class="rr-num">'+(i+1)+'.</span>'+
      '<span class="rr-p'+(p1win?' win':done&&!p1win?' lose':'')+'">'+esc(m.player1_name||'—')+'</span>'+
      '<span class="rr-vs">vs</span>'+
      '<span class="rr-p'+(p2win?' win':done&&!p2win?' lose':'')+'">'+esc(m.player2_name||'—')+'</span>'+
      '<span class="rr-status">'+(m.status==='ready'?'🎱':m.status==='done'?'✅':'⏳')+'</span>';
    mList.appendChild(card);
  });

  const stand = document.createElement('div');
  stand.className = 'standings';
  stand.innerHTML = '<div class="st-hdr">Turnir Jadvali</div>';

  const wins={}, played={}, players={};
  for (const m of matches) {
    if (m.player1_tg_id&&m.player1_name) players[m.player1_tg_id]=m.player1_name;
    if (m.player2_tg_id&&m.player2_name) players[m.player2_tg_id]=m.player2_name;
    if (m.status==='done'&&m.winner_tg_id) {
      wins[m.winner_tg_id]=(wins[m.winner_tg_id]||0)+1;
      [m.player1_tg_id,m.player2_tg_id].forEach(id=>{if(id)played[id]=(played[id]||0)+1});
    }
  }

  const hrow = document.createElement('div');
  hrow.className = 's-row';
  hrow.style.cssText = 'border-bottom:1px solid rgba(26,74,34,.3);font-size:.62rem;color:var(--text-muted);letter-spacing:1px';
  hrow.innerHTML = '<span>#</span><span>O\'YINCHI</span><span style="text-align:center">O</span><span style="text-align:center;color:#30c060">G</span><span style="text-align:center">M</span>';
  stand.appendChild(hrow);

  Object.entries(players)
    .sort((a,b)=>(wins[b[0]]||0)-(wins[a[0]]||0))
    .forEach(([id,name],idx) => {
      const w=wins[id]||0, p=played[id]||0, l=p-w;
      const rankIco=idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':idx+1;
      const rankCls=idx===0?'r1':idx===1?'r2':idx===2?'r3':'';
      const row = document.createElement('div');
      row.className = 's-row'+(idx===0?' first':'');
      row.innerHTML =
        '<span class="s-rank '+rankCls+'">'+rankIco+'</span>'+
        '<span class="s-name">'+esc(name)+'</span>'+
        '<span class="s-num">'+p+'</span>'+
        '<span class="s-num w">'+w+'</span>'+
        '<span class="s-num">'+l+'</span>';
      stand.appendChild(row);
    });

  wrap.appendChild(mList);
  wrap.appendChild(stand);
  container.appendChild(wrap);
}

/* ── HELPERS ── */
function groupByRound(matches) {
  const r={};
  for (const m of matches) { if(!r[m.round]) r[m.round]=[]; r[m.round].push(m); }
  return r;
}
function mkBracket() {
  const d=document.createElement('div'); d.className='bracket'; return d;
}
function mkSec(title, cls) {
  const sec=document.createElement('div'); sec.className='sec-wrap';
  const hdr=document.createElement('div'); hdr.className='sec-hdr '+(cls||''); hdr.textContent=title;
  sec.appendChild(hdr); return sec;
}
function mkRoundCol(rmatches, label, round) {
  const col=document.createElement('div'); col.className='round-col';
  const lbl=document.createElement('div'); lbl.className='round-lbl'; lbl.textContent=label;
  col.appendChild(lbl);
  const mc=document.createElement('div'); mc.className='matches-col';
  mc.style.gap=(Math.pow(2,round-1)*10)+'px';
  for (const m of (rmatches||[])) {
    const slot=document.createElement('div'); slot.className='match-slot';
    slot.appendChild(buildCard(m)); mc.appendChild(slot);
  }
  col.appendChild(mc); return col;
}
function mkConn() {
  const d=document.createElement('div'); d.className='conn';
  d.innerHTML='<div class="conn-line"></div>'; return d;
}
function mkWinner(name) {
  const w=document.createElement('div'); w.className='winner-col';
  w.innerHTML='<div class="trophy">🏆</div><div class="winner-name">'+esc(name||'—')+'</div><div class="winner-sub">G\'olib</div>';
  return w;
}
function buildCard(m) {
  if (m.status==='void') { const d=document.createElement('div'); d.className='void-el'; return d; }
  if (m.status==='bye') {
    const d=document.createElement('div'); d.className='bye-el';
    d.textContent=esc(m.player1_name||'—')+' → keyingi bosqich'; return d;
  }
  const live=m.status==='ready', done=m.status==='done';
  const div=document.createElement('div');
  div.className='mcard'+(live?' live':'')+(done?' done':'');
  const p1win=done&&m.winner_tg_id!=null&&m.winner_tg_id===m.player1_tg_id;
  const p2win=done&&m.winner_tg_id!=null&&m.winner_tg_id===m.player2_tg_id;
  div.innerHTML=mkPlayer(m.player1_name,live,p1win,done&&!p1win)+mkPlayer(m.player2_name,live,p2win,done&&!p2win);
  return div;
}
function mkPlayer(name,live,win,lose) {
  const cls=win?' win':lose?' lose':'';
  const ico=win?'👑':live?'🎱':'○';
  return '<div class="player'+cls+'"><span class="ico">'+ico+'</span><span class="pname">'+esc(name||'—')+'</span></div>';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtDate(iso){
  if(!iso)return'—';
  const d=new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})+
    ' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function statusLabel(s){
  return {registration:"📋 Ro'yxat",in_progress:'⚡ Jarayonda',finished:'🏆 Yakunlandi',cancelled:'❌ Bekor'}[s]||s;
}
function typeLabel(t){
  return {single_elimination:'🎯 Single Elimination',double_elimination:'🔄 Double Elimination',round_robin:'🔁 Round Robin'}[t]||null;
}

loadData();
connectSSE();
</script>
