<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Turnir — Billiard King</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#D4AF37;--gold-l:#F0D878;--gold-glow:rgba(212,175,55,.25);
  --bg:#06060e;--card:#0d0d1c;--card2:#111128;
  --border:rgba(212,175,55,.18);--border2:rgba(100,100,180,.1);
  --text:#e0e0f0;--text2:#6060a0;--text3:#30304a;
  --green:#30c060;--red:#e03040;--blue:#4090e0;--orange:#d07020;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{text-decoration:none;color:inherit}

/* ── NAV ── */
.nav{position:sticky;top:0;z-index:50;background:rgba(6,6,14,.97);border-bottom:1px solid var(--border2);backdrop-filter:blur(16px);display:flex;align-items:center;gap:12px;padding:0 16px;height:50px}
.nav-back{color:var(--text2);font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:.7rem;letter-spacing:.5px}
.nav-back:hover{color:var(--gold)}
.nav-title{flex:1;font-size:.78rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.live-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;border:1px solid #30b030;background:#04080404;font-size:.58rem;color:#30c030;white-space:nowrap;flex-shrink:0}
.live-badge.off{border-color:#222;color:#333}
.ldot{width:5px;height:5px;border-radius:50%;background:#30c030;animation:pulse 1.4s infinite;flex-shrink:0}
.live-badge.off .ldot{background:#333;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

/* ── HEADER ── */
.hdr{padding:20px 16px 16px;border-bottom:1px solid var(--border2);background:linear-gradient(180deg,rgba(212,175,55,.04) 0%,transparent 100%)}
.hdr-name{font-size:1.35rem;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(212,175,55,.2);margin-bottom:10px;line-height:1.2}
.hdr-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:.6rem;font-weight:700;letter-spacing:.5px;border:1px solid}
.p-reg{background:rgba(212,175,55,.08);color:var(--gold);border-color:rgba(212,175,55,.25)}
.p-prog{background:rgba(48,192,96,.08);color:var(--green);border-color:rgba(48,192,96,.25)}
.p-fin{background:rgba(64,144,224,.08);color:var(--blue);border-color:rgba(64,144,224,.2)}
.p-can{background:rgba(60,60,80,.1);color:#444;border-color:#1a1a28}
.p-type{background:rgba(64,144,224,.06);color:var(--blue);border-color:rgba(64,144,224,.15)}
.hdr-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:.68rem;color:var(--text2)}
.hdr-meta span{display:inline-flex;align-items:center;gap:4px}

/* ── SLOTS ── */
.slots-wrap{margin-top:12px;display:flex;align-items:center;gap:10px}
.slots-bar{flex:1;height:4px;background:var(--card2);border-radius:2px;overflow:hidden}
.slots-fill{height:100%;background:var(--gold);border-radius:2px;transition:.4s}
.slots-fill.full{background:var(--red)}
.slots-txt{font-size:.65rem;color:var(--text2);white-space:nowrap}

/* ── BOT CTA (registration phase) ── */
.cta-wrap{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;border-bottom:1px solid var(--border2)}
.cta-title{font-size:.9rem;font-weight:700;color:var(--text)}
.cta-sub{font-size:.72rem;color:var(--text2);max-width:280px;line-height:1.5}
.cta-btn{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#000;padding:11px 24px;border-radius:6px;font-size:.74rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-decoration:none}
.cta-btn:hover{background:var(--gold-l)}

/* ── BRACKET SECTIONS ── */
.section{padding:0 0 24px}
.sec-hdr{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text2)}
.sec-hdr::after{content:'';flex:1;height:1px;background:currentColor;opacity:.15}
.sec-hdr.wb{color:#c0a000}
.sec-hdr.lb{color:#4080c0}
.sec-hdr.gf{color:#c04080}

/* ── BRACKET SCROLL ── */
.bracket{display:flex;align-items:stretch;padding:0 16px 4px;gap:0;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.bracket::-webkit-scrollbar{height:4px}
.bracket::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.round-col{display:flex;flex-direction:column;align-items:center;min-width:196px}
.round-lbl{font-size:.56rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:8px;padding:2px 8px;background:rgba(255,255,255,.02);border-radius:4px;white-space:nowrap}
.matches-col{display:flex;flex-direction:column;width:100%;flex:1}
.match-slot{display:flex;align-items:center;flex:1;min-height:104px;padding:8px 0}
.conn{display:flex;flex-direction:column;justify-content:center;width:24px;flex-shrink:0;align-self:stretch}
.conn-line{border-top:1px solid var(--border2);width:100%}

/* ── MATCH CARD ── */
.card{width:182px;border-radius:8px;overflow:hidden;border:1px solid var(--border2);background:linear-gradient(160deg,#0c0c20,#080818);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.card.live{border-color:rgba(212,175,55,.5);box-shadow:0 0 16px rgba(212,175,55,.2)}
.card.done{border-color:rgba(48,192,96,.15);background:linear-gradient(160deg,#080f0a,#050d07)}
.card-head{display:flex;align-items:center;gap:5px;padding:5px 9px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}
.ch-num{font-size:.56rem;font-weight:800;color:#6060a0;flex-shrink:0}
.ch-tbl{font-size:.56rem;font-weight:700;color:#7090d0;background:rgba(80,120,210,.14);padding:1px 6px;border-radius:3px;white-space:nowrap}
.ch-time{font-size:.58rem;font-weight:700;color:var(--gold);margin-left:auto;white-space:nowrap}
.player{padding:8px 10px;font-size:.78rem;display:flex;align-items:center;gap:6px}
.player+.player{border-top:1px solid rgba(255,255,255,.05)}
.player.win{background:rgba(212,175,55,.12);color:var(--gold);font-weight:700}
.player.lose{color:var(--text3)}
.p-ico{width:14px;text-align:center;font-size:.65rem;flex-shrink:0}
.p-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.p-score{font-size:.7rem;font-weight:700;color:var(--text2);flex-shrink:0;min-width:14px;text-align:right}
.bye-card{width:182px;padding:10px 12px;border-radius:8px;border:1px dashed var(--border2);background:var(--bg);color:var(--text3);font-size:.72rem;font-style:italic}
.void-card{width:182px;height:54px}

/* ── WINNER ── */
.winner-col{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:120px;gap:6px;padding:16px}
.w-trophy{font-size:2.8rem;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(212,175,55,.4))}
.w-name{font-size:.95rem;font-weight:800;color:var(--gold);text-align:center}
.w-sub{font-size:.55rem;color:var(--text2);text-transform:uppercase;letter-spacing:2px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ── GRAND FINAL ── */
.gf-wrap{display:flex;align-items:center;justify-content:center;padding:8px 16px 16px;gap:16px;flex-wrap:wrap}
.gf-lbl{font-size:.6rem;color:#c04080;text-align:center;margin-bottom:6px;text-transform:uppercase;letter-spacing:1.5px}

/* ── ROUND ROBIN ── */
.rr-wrap{padding:4px 16px 24px}
.rr-matches{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.rr-card{border-radius:8px;border:1px solid var(--border2);background:var(--card);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:.8rem}
.rr-card.live{border-color:rgba(212,175,55,.4)}
.rr-card.done{border-color:rgba(48,192,96,.12);background:linear-gradient(160deg,#080f0a,#050d07)}
.rr-num{font-size:.6rem;color:var(--text3);min-width:20px;text-align:right}
.rr-p{flex:1;text-align:center}
.rr-p.win{color:var(--gold);font-weight:700}
.rr-p.lose{color:var(--text3)}
.rr-vs{color:var(--text3);font-size:.7rem;flex-shrink:0}
.rr-st{font-size:.7rem;min-width:18px;text-align:right;flex-shrink:0}
.standings{border-radius:8px;border:1px solid var(--border2);background:var(--card);overflow:hidden}
.st-hdr{padding:10px 14px;font-size:.58rem;text-transform:uppercase;letter-spacing:2px;color:var(--text2);border-bottom:1px solid var(--border2)}
.st-row{display:grid;grid-template-columns:26px 1fr 32px 32px 32px;align-items:center;gap:6px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.03);font-size:.8rem}
.st-row:last-child{border-bottom:none}
.st-row.gold{background:rgba(212,175,55,.06)}
.s-rank{font-size:.68rem;font-weight:700;color:var(--text3)}
.s-rank.r1{color:var(--gold)}
.s-rank.r2{color:#c0c0c0}
.s-rank.r3{color:#c08060}
.s-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-num{text-align:center;color:var(--text2);font-size:.72rem}
.s-num.w{color:var(--green);font-weight:700}

/* ── PARTICIPANTS ── */
.participants{padding:4px 16px 24px}
.p-item{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--card);border:1px solid var(--border2);border-radius:8px;margin-bottom:6px;font-size:.8rem}
.p-num{font-size:.65rem;color:var(--text3);min-width:20px}

/* ── MY REG STATUS ── */
.my-reg{padding:14px 16px;border-bottom:1px solid var(--border2)}
.reg-card{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:10px;border:1px solid}
.reg-pending{background:rgba(212,175,55,.06);border-color:rgba(212,175,55,.22)}
.reg-approved{background:rgba(48,192,96,.06);border-color:rgba(48,192,96,.22)}
.reg-rejected{background:rgba(224,48,64,.06);border-color:rgba(224,48,64,.22)}
.reg-ico{font-size:1.3rem;flex-shrink:0}
.reg-title{font-size:.85rem;font-weight:700}
.reg-sub{font-size:.68rem;color:var(--text2);margin-top:3px}

/* ── LOADING / EMPTY ── */
.loader{display:flex;align-items:center;justify-content:center;padding:60px;flex-direction:column;gap:12px;color:var(--text2);font-size:.8rem}
.spinner{width:32px;height:32px;border:2.5px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-msg{padding:40px 16px;text-align:center;color:var(--text3);font-size:.82rem;line-height:2}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-back" href="/turnirlar">‹ Turnirlar</a>
  <div class="nav-title" id="nav-title">Yuklanmoqda…</div>
  <div class="live-badge off" id="live-badge">
    <div class="ldot" id="ldot"></div>
    <span id="live-txt">—</span>
  </div>
</nav>

<div id="root">
  <div class="loader"><div class="spinner"></div><div>Yuklanmoqda…</div></div>
</div>

<script>
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const TRN_ID = (() => {
  const m = window.location.pathname.match(/\/turnir\/(\d+)/);
  return m ? parseInt(m[1]) : null;
})();

const STATUS_CLS = {registration:'p-reg',in_progress:'p-prog',finished:'p-fin',cancelled:'p-can'};
const STATUS_LBL = {registration:'Ro\'yxat',in_progress:'Jarayonda',finished:'Yakunlandi',cancelled:'Bekor'};
const TYPE_LBL   = {single_elimination:'Single Elimination',double_elimination:'Double Elimination',round_robin:'Round Robin'};
const TYPE_S     = {single_elimination:'SE',double_elimination:'DE',round_robin:'RR'};

function fmtDT(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'})
       + ' · ' + d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
}

if (!TRN_ID) {
  document.getElementById('root').innerHTML = '<div class="empty-msg">❌ Noto\'g\'ri URL</div>';
}

let trn = null, matches = [], registrations = [], myRegStatus = null;

async function loadMyReg() {
  const jwt = localStorage.getItem('bk_jwt');
  if (!jwt) return;
  try {
    const r = await fetch('/api/me/tournaments', {
      headers: { 'Authorization': 'Bearer ' + jwt }
    });
    if (!r.ok) return;
    const list = await r.json() || [];
    const entry = list.find(t => t.tournament_id === TRN_ID);
    if (entry) myRegStatus = entry.reg_status;
  } catch(_) {}
}

async function load() {
  try {
    matches = []; registrations = [];
    const r1 = await fetch(`/api/tournaments/${TRN_ID}`);
    if (!r1.ok) throw new Error('Turnir topilmadi');
    trn = await r1.json();

    if (trn.status === 'registration') {
      const [r2] = await Promise.all([
        fetch(`/api/tournaments/${TRN_ID}/registrations`),
        loadMyReg()
      ]);
      registrations = r2.ok ? (await r2.json() || []) : [];
    } else {
      const [r2] = await Promise.all([
        fetch(`/api/tournaments/${TRN_ID}/bracket`),
        loadMyReg()
      ]);
      matches = r2.ok ? (await r2.json() || []) : [];
    }

    render();
  } catch(e) {
    document.getElementById('root').innerHTML = `<div class="empty-msg">❌<br>${esc(e.message)}</div>`;
  }
}

function render() {
  document.getElementById('nav-title').textContent = trn.name || 'Turnir';
  document.title = (trn.name || 'Turnir') + ' — Billiard King';

  const cnt  = trn.approved_count || 0;
  const fill = Math.min(100, Math.round((cnt / trn.max_players) * 100));
  const full = cnt >= trn.max_players;

  const isLive = trn.status === 'in_progress';

  if (isLive) {
    document.getElementById('live-badge').className = 'live-badge';
    document.getElementById('live-txt').textContent = 'JONLI';
  }

  let html = `
    <div class="hdr">
      <div class="hdr-name">${esc(trn.name)}</div>
      <div class="hdr-pills">
        <span class="pill ${STATUS_CLS[trn.status]||'p-can'}">${STATUS_LBL[trn.status]||trn.status}</span>
        <span class="pill p-type">${TYPE_S[trn.type]||'SE'} · ${TYPE_LBL[trn.type]||trn.type}</span>
      </div>
      <div class="hdr-meta">
        <span>📅 ${fmtDT(trn.scheduled_at)}</span>
        ${trn.branch_name?`<span>🏢 ${esc(trn.branch_name)}</span>`:''}
        ${trn.price>0?`<span>💰 ${trn.price.toLocaleString()} so'm</span>`:'<span>🆓 Bepul</span>'}
      </div>
      <div class="slots-wrap">
        <div class="slots-bar"><div class="slots-fill${full?' full':''}" style="width:${fill}%"></div></div>
        <div class="slots-txt">${cnt} / ${trn.max_players} ishtirokchi</div>
      </div>
    </div>`;

  html += regStatusHTML(trn, myRegStatus);

  document.getElementById('root').innerHTML = html + '<div id="bracket-area"></div>';

  const area = document.getElementById('bracket-area');

  if (trn.status === 'registration') {
    renderParticipants(area);
  } else if (trn.status === 'in_progress' || trn.status === 'finished') {
    if (matches.length) {
      renderBracket(area, trn, matches);
    } else {
      area.innerHTML = '<div class="empty-msg">⏳<br>Bracket hali yaratilmagan</div>';
    }
  }
}

function renderParticipants(container) {
  const approved = (registrations || []).filter(r => r.status === 'approved');
  const pending  = (registrations || []).filter(r => r.status === 'pending');

  addSecHdr(container, `👥 Ishtirokchilar (${approved.length} / ${trn.max_players})`, 'wb');

  if (approved.length === 0) {
    const d = el('div'); d.className = 'empty-msg';
    d.innerHTML = '⏳<br>Hali tasdiqlangan ishtirokchilar yo\'q';
    container.appendChild(d);
  } else {
    const list = el('div', 'participants');
    approved.forEach((r, i) => {
      const item = el('div', 'p-item');
      item.innerHTML = `<span class="p-num">${i+1}</span><span>${esc(r.user_name)}</span>`;
      list.appendChild(item);
    });
    container.appendChild(list);
  }

  if (pending.length > 0) {
    addSecHdr(container, `⏳ Kutilmoqda (${pending.length})`, '');
    const list = el('div', 'participants');
    pending.forEach(r => {
      const item = el('div', 'p-item');
      item.style.opacity = '0.45';
      item.innerHTML = `<span class="p-num">•</span><span>${esc(r.user_name)}</span>`;
      list.appendChild(item);
    });
    container.appendChild(list);
  }
}

function regStatusHTML(t, rs) {
  if (rs === 'approved') return `<div class="my-reg">
    <div class="reg-card reg-approved">
      <div class="reg-ico">✅</div>
      <div><div class="reg-title">Siz ro'yxatdan o'tgansiz</div>
      <div class="reg-sub">Turnir boshlanishini kuting</div></div>
    </div></div>`;
  if (rs === 'pending') return `<div class="my-reg">
    <div class="reg-card reg-pending">
      <div class="reg-ico">⏳</div>
      <div><div class="reg-title">So'rovingiz tekshirilmoqda</div>
      <div class="reg-sub">Admin tasdiqlashini kuting</div></div>
    </div></div>`;
  if (rs === 'rejected') return `<div class="my-reg">
    <div class="reg-card reg-rejected">
      <div class="reg-ico">❌</div>
      <div><div class="reg-title">So'rovingiz rad etildi</div>
      <div class="reg-sub">Batafsil ma'lumot uchun botga murojaat qiling</div></div>
    </div></div>`;
  if (t.status === 'registration') return `<div class="cta-wrap">
    <div class="cta-title">📝 Ro'yxatdan o'tish</div>
    <div class="cta-sub">Ushbu turnirga qatnashish uchun Telegram bot orqali murojaat qiling</div>
    <a class="cta-btn" href="https://t.me/BilliardKingBot" target="_blank">🤖 Botga o'tish</a>
  </div>`;
  return '';
}

/* ════════════════════════════════
   BRACKET RENDERER
════════════════════════════════ */
function renderBracket(container, t, ms) {
  if (t.type === 'double_elimination') renderDE(container, t, ms);
  else if (t.type === 'round_robin')   renderRR(container, t, ms);
  else                                  renderSE(container, t, ms);
}

/* ── Single Elimination ── */
function renderSE(c, t, ms) {
  const rounds = byRound(ms);
  const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  if (!nums.length) return;
  const maxR = nums[nums.length-1];

  addSecHdr(c, '🏆 Bracket', 'wb');
  const br = mkBracket();
  nums.forEach((r, i) => {
    if (i > 0) br.appendChild(mkConn());
    br.appendChild(mkRoundCol(rounds[r], r===maxR ? 'Final' : `${r}-bosqich`, r));
  });
  if (t.status === 'finished') {
    let w = null;
    for (const m of rounds[maxR]||[]) if (m.status==='done' && m.winner_name) w = m.winner_name;
    br.appendChild(mkConn());
    br.appendChild(mkWinner(w));
  }
  c.appendChild(br);
}

/* ── Double Elimination ── */
function renderDE(c, t, ms) {
  const wb = ms.filter(m=>m.match_type==='winners');
  const lb = ms.filter(m=>m.match_type==='losers');
  const gf = ms.filter(m=>m.match_type==='grand_final');

  if (wb.length) {
    const sec = mkSection();
    addSecHdr(sec,'🏆 Winners Bracket','wb');
    const rounds = byRound(wb);
    const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    const maxR = nums[nums.length-1];
    const br = mkBracket();
    nums.forEach((r,i)=>{
      if(i>0) br.appendChild(mkConn());
      br.appendChild(mkRoundCol(rounds[r], r===maxR?'WB Final':'WB R'+r, r));
    });
    sec.appendChild(br); c.appendChild(sec);
  }
  if (lb.length) {
    const sec = mkSection();
    addSecHdr(sec,'⬇ Losers Bracket','lb');
    const rounds = byRound(lb);
    const nums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    const maxR = nums[nums.length-1];
    const br = mkBracket();
    nums.forEach((r,i)=>{
      if(i>0) br.appendChild(mkConn());
      const lbR = r-1000;
      br.appendChild(mkRoundCol(rounds[r], r===maxR?'LB Final':'LB R'+lbR, r));
    });
    sec.appendChild(br); c.appendChild(sec);
  }
  if (gf.length) {
    const sec = mkSection();
    addSecHdr(sec,'🎯 Grand Final','gf');
    const wrap = el('div','gf-wrap');
    for (const m of gf) {
      const col = el('div');
      const lbl = el('div','gf-lbl'); lbl.textContent='Grand Final';
      col.appendChild(lbl);
      col.appendChild(buildCard(m));
      wrap.appendChild(col);
    }
    if (t.status==='finished') {
      let w=null;
      for(const m of gf) if(m.status==='done'&&m.winner_name) w=m.winner_name;
      wrap.appendChild(mkConn()); wrap.appendChild(mkWinner(w));
    }
    sec.appendChild(wrap); c.appendChild(sec);
  }
  if (!wb.length && !lb.length && !gf.length) renderSE(c,t,ms);
}

/* ── Round Robin ── */
function renderRR(c, t, ms) {
  const wrap = el('div','rr-wrap');

  // matches
  const mSec = el('div');
  addSecHdr(mSec,'⚽ O\'yinlar','wb');
  const mList = el('div','rr-matches');
  ms.forEach((m, i) => {
    const done=m.status==='done';
    const p1w=done&&m.winner_slot===1;
    const p2w=done&&m.winner_slot===2;
    const card=el('div','rr-card'+(m.status==='ready'?' live':done?' done':''));
    card.innerHTML=`<span class="rr-num">${i+1}.</span>
      <span class="rr-p${p1w?' win':done&&!p1w?' lose':''}">${esc(m.player1_name||'—')}</span>
      <span class="rr-vs">vs</span>
      <span class="rr-p${p2w?' win':done&&!p2w?' lose':''}">${esc(m.player2_name||'—')}</span>
      <span class="rr-st">${m.status==='ready'?'🎱':done?'✅':m.status==='pending'?'⏳':''}</span>`;
    mList.appendChild(card);
  });
  mSec.appendChild(mList);
  wrap.appendChild(mSec);

  // standings — ism bo'yicha kalit (BigInt aniqlik muammosidan qochish)
  const wins={}, played={}, players={};
  for(const m of ms) {
    if(m.player1_name) players[m.player1_name]=m.player1_name;
    if(m.player2_name) players[m.player2_name]=m.player2_name;
    if(m.status==='done') {
      const wn=m.winner_slot===1?m.player1_name:m.winner_slot===2?m.player2_name:null;
      if(wn) wins[wn]=(wins[wn]||0)+1;
      if(m.player1_name)played[m.player1_name]=(played[m.player1_name]||0)+1;
      if(m.player2_name)played[m.player2_name]=(played[m.player2_name]||0)+1;
    }
  }
  const sorted=Object.entries(players).sort((a,b)=>(wins[b[0]]||0)-(wins[a[0]]||0));

  if (sorted.length) {
    const stSec = el('div');
    addSecHdr(stSec,'📊 Jadval','lb');
    const stand = el('div','standings');
    const shdr = el('div','st-hdr');
    shdr.innerHTML='<span style="grid-column:1/3">O\'YINCHI</span><span style="text-align:center;color:#404070;font-size:.6rem">O</span><span style="text-align:center;color:var(--green);font-size:.6rem">G</span><span style="text-align:center;color:#604040;font-size:.6rem">M</span>';
    stand.appendChild(shdr);
    sorted.forEach(([id,name],idx)=>{
      const w=wins[id]||0, p=played[id]||0, l=p-w;
      const row=el('div','st-row'+(idx===0?' gold':''));
      const rc=['','r1','r2','r3'][idx]||'';
      const ri=['','🥇','🥈','🥉'][idx]||idx+1;
      row.innerHTML=`<span class="s-rank ${rc}">${ri}</span><span class="s-name">${esc(name)}</span><span class="s-num">${p}</span><span class="s-num w">${w}</span><span class="s-num">${l}</span>`;
      stand.appendChild(row);
    });
    stSec.appendChild(stand);
    wrap.appendChild(stSec);
  }

  c.appendChild(wrap);
}

/* ── Helpers ── */
function el(tag, cls) {
  const e = document.createElement(tag||'div');
  if (cls) e.className = cls;
  return e;
}
function byRound(ms) {
  const r={};
  for(const m of ms){ if(!r[m.round]) r[m.round]=[]; r[m.round].push(m); }
  return r;
}
function mkBracket() { return el('div','bracket'); }
function mkSection() { return el('div','section'); }
function addSecHdr(parent, txt, cls) {
  const h=el('div','sec-hdr'+(cls?' '+cls:''));
  h.textContent=txt; parent.appendChild(h);
}
function mkConn() {
  const c=el('div','conn'); const l=el('div','conn-line'); c.appendChild(l); return c;
}
function mkRoundCol(msList, label, round) {
  const col = el('div','round-col');
  const lbl = el('div','round-lbl'); lbl.textContent=label; col.appendChild(lbl);
  const mc  = el('div','matches-col');
  for (const m of (msList||[])) {
    const slot = el('div','match-slot');
    if (m.status==='void') slot.appendChild(el('div','void-card'));
    else if (m.status==='bye') {
      const b=el('div','bye-card');
      b.textContent=(m.player1_name||m.player2_name||'BYE')+' — avtomatik o\'tdi';
      slot.appendChild(b);
    } else {
      slot.appendChild(buildCard(m));
    }
    mc.appendChild(slot);
  }
  col.appendChild(mc);
  return col;
}
function brkTime(iso){
  if(!iso) return '';
  const uz=new Date(new Date(iso).getTime()+5*3600000);
  const p=n=>String(n).padStart(2,'0');
  return p(uz.getUTCDate())+'.'+p(uz.getUTCMonth()+1)+' '+p(uz.getUTCHours())+':'+p(uz.getUTCMinutes());
}
function buildCard(m) {
  const done = m.status==='done';
  const live = m.status==='in_progress'||m.status==='ready';
  const card = el('div','card'+(live?' live':done?' done':''));
  // winner_slot orqali (BigInt aniqlik muammosidan qochish uchun)
  const p1w  = done && m.winner_slot===1;
  const p2w  = done && m.winner_slot===2;

  // Header: match raqami + stol + vaqt
  const head=el('div','card-head');
  const num=el('span','ch-num'); num.textContent='#'+m.match_num; head.appendChild(num);
  if(m.table_num>0){const tb=el('span','ch-tbl'); tb.textContent=m.table_num+'-stol'; head.appendChild(tb);}
  const tm=brkTime(m.match_scheduled_at);
  if(tm){const tt=el('span','ch-time'); tt.textContent='🕐 '+tm; head.appendChild(tt);}
  else if(m.table_num<=0){const tt=el('span','ch-time'); tt.style.color='var(--text3)'; tt.textContent='—'; head.appendChild(tt);}
  card.appendChild(head);

  const hasScore=done&&((m.player1_score||0)>0||(m.player2_score||0)>0);
  function mkPlayer(name, isWin, score) {
    const p = el('div','player'+(isWin?' win':done&&!isWin?' lose':''));
    const ico=el('span','p-ico'); ico.textContent=isWin?'🏆':live?'🎱':done?'❌':'';
    const nm =el('span','p-name'); nm.textContent=name||'—';
    p.appendChild(ico); p.appendChild(nm);
    if (hasScore) {
      const sc=el('span','p-score'); sc.textContent=score||0; p.appendChild(sc);
    }
    return p;
  }
  card.appendChild(mkPlayer(m.player1_name, p1w, m.player1_score));
  card.appendChild(mkPlayer(m.player2_name, p2w, m.player2_score));
  return card;
}
function mkWinner(name) {
  const col=el('div','winner-col');
  const tr=el('div','w-trophy'); tr.textContent='🏆';
  const nm=el('div','w-name'); nm.textContent=name||'—';
  const sb=el('div','w-sub'); sb.textContent='G\'OLIB';
  col.appendChild(tr); col.appendChild(nm); col.appendChild(sb);
  return col;
}

/* ── SSE ── */
let sse, retry=2000;
function connectSSE() {
  if (!TRN_ID) return;
  sse = new EventSource(`/api/tournaments/${TRN_ID}/sse`);
  sse.onopen = () => {
    retry=2000;
    const b=document.getElementById('live-badge');
    b.className='live-badge';
    document.getElementById('ldot').style.animation='';
    document.getElementById('live-txt').textContent='JONLI';
  };
  sse.onmessage = e => {
    try { if(JSON.parse(e.data).type==='refresh') load(); } catch(_){}
  };
  sse.onerror = () => {
    const b=document.getElementById('live-badge');
    if(b) b.className='live-badge off';
    sse.close();
    setTimeout(connectSSE, retry);
    retry=Math.min(retry*2,30000);
  };
}

if (TRN_ID) { load(); connectSSE(); }
</script>
