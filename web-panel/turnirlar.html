<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Billiard King — Turnirlar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  --gold:#D4AF37;--gold2:#B8941F;--gold-l:#F0D878;--gold-glow:rgba(212,175,55,.32);
  --em:#0D3B2E;--em2:#092A20;
  --bg:#0E0E0E;--bg2:#080808;
  --card:#141414;--card2:#181818;
  --border:rgba(212,175,55,.15);--border2:rgba(212,175,55,.07);
  --text:#F0F0F0;--text2:#888;--text3:#4A4A4A;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
a{text-decoration:none;color:inherit}

nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:rgba(8,8,8,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border2)}
.nav-logo img{height:44px;width:auto;filter:drop-shadow(0 0 10px var(--gold-glow))}
.nav-links{display:flex;gap:32px;font-size:.72rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text3)}
.nav-links a:hover,.nav-links a.active{color:var(--gold)}
.nav-cta{background:var(--gold);color:#000;padding:9px 22px;border-radius:2px;font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;transition:.2s;white-space:nowrap}
.nav-cta:hover{background:var(--gold-l);box-shadow:0 0 20px var(--gold-glow)}
.nav-burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:none;border:none}
.nav-burger span{display:block;width:22px;height:2px;background:var(--text2);border-radius:2px;transition:.3s}
.nav-burger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.nav-burger.open span:nth-child(2){opacity:0}
.nav-burger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.nav-mobile{display:none;position:fixed;top:64px;left:0;right:0;z-index:99;background:rgba(8,8,8,.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border2);flex-direction:column;padding:16px 24px 24px;gap:2px}
.nav-mobile.open{display:flex}
.nav-mobile a{padding:13px 8px;font-size:.82rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);border-bottom:1px solid rgba(255,255,255,.04);transition:.2s}
.nav-mobile a:last-child{border-bottom:none;color:var(--gold);margin-top:8px}
.nav-mobile a:hover{color:var(--gold)}
@media(max-width:700px){.nav-links,.nav-cta{display:none}.nav-burger{display:flex}}

/* HERO */
.page-hero{background:var(--em);background-image:radial-gradient(circle,rgba(255,255,255,.02) 1px,transparent 1px);background-size:7px 7px;padding:52px 40px 44px;position:relative;overflow:hidden}
.page-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 100% at 50% 0%,rgba(212,175,55,.07) 0%,transparent 70%);pointer-events:none}
.page-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.3),transparent)}
.ph-inner{max-width:960px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
.ph-eye{font-size:.54rem;letter-spacing:6px;text-transform:uppercase;color:rgba(212,175,55,.6);margin-bottom:10px}
.ph-title{font-size:clamp(2rem,5vw,3rem);font-weight:900;letter-spacing:-1.5px;color:#F0F0F0}
.ph-sub{color:rgba(255,255,255,.45);font-size:.82rem;margin-top:8px;max-width:380px;line-height:1.7}
.ph-badge{background:rgba(0,0,0,.4);border:1px solid var(--border);border-left:2px solid var(--gold);padding:10px 18px;border-radius:2px;font-size:.7rem;color:rgba(255,255,255,.5);white-space:nowrap}
.ph-badge strong{color:var(--gold);display:block;font-size:.95rem;font-weight:800;letter-spacing:-.5px}
@media(max-width:600px){.page-hero{padding:40px 24px 32px}}

/* CONTENT */
.main{max-width:960px;margin:0 auto;padding:32px 20px 80px}

.sec-title{display:flex;align-items:center;gap:10px;font-size:.56rem;text-transform:uppercase;letter-spacing:4px;color:var(--text3);margin-bottom:16px;margin-top:36px}
.sec-title:first-child{margin-top:0}
.sec-title .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(212,175,55,.15),transparent)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2px;background:rgba(212,175,55,.06)}

.card{display:block;text-decoration:none;color:inherit;padding:20px 22px;background:var(--card);transition:background .2s,box-shadow .2s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0;transition:.3s}
.card:hover{background:var(--card2);box-shadow:0 0 0 1px rgba(212,175,55,.12)}
.card:hover::before{opacity:1}
.card.finished{opacity:.55}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-name{font-size:.98rem;font-weight:700;color:var(--text);line-height:1.3}
.badge{flex-shrink:0;font-size:.6rem;padding:3px 10px;border-radius:2px;font-weight:700;white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.b-reg{background:rgba(13,59,46,.35);border:1px solid rgba(20,100,60,.4);color:#3CC078}
.b-live{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.35);color:var(--gold-l);animation:bpulse 1.8s infinite}
.b-done{background:rgba(40,40,60,.15);border:1px solid rgba(80,80,120,.2);color:#6070A0}
.b-cancel{background:rgba(100,20,20,.12);border:1px solid rgba(140,30,30,.2);color:#A06060}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.5}}

.card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tag{font-size:.68rem;color:var(--text3);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:2px;padding:2px 9px}

.card-footer{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar-wrap{flex:1}
.bar-lbl{font-size:.62rem;color:var(--text3);margin-bottom:5px}
.bar{height:2px;background:rgba(255,255,255,.05);overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--em),var(--gold));transition:width .5s}
.pcount{font-size:.7rem;color:var(--text3)}
.arr{color:var(--text3);font-size:1.1rem;transition:color .2s,transform .2s;flex-shrink:0}
.card:hover .arr{color:var(--gold);transform:translateX(2px)}

.loader{display:flex;align-items:center;justify-content:center;gap:14px;padding:80px;color:var(--text3)}
.spin{width:26px;height:26px;border:2px solid rgba(212,175,55,.15);border-top-color:var(--gold);border-radius:50%;animation:rot .7s linear infinite;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:.9rem}
.empty .ico{font-size:2.6rem;display:block;margin-bottom:12px;opacity:.3}

footer{background:var(--bg2);border-top:1px solid var(--border2);padding:20px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.foot-logo img{height:28px;opacity:.4;filter:drop-shadow(0 0 4px var(--gold-glow))}
.foot-r{font-size:.63rem;color:var(--text3);letter-spacing:1px}
@media(max-width:600px){.main{padding:24px 16px 72px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><img src="/logo.jpg" alt="Billiard King"></a>
  <div class="nav-links">
    <a href="/turnirlar" class="active">Turnirlar</a>
    <a href="/shop">Do'kon</a>
    <a href="/jamiyat">Jamiyat</a>
    <a href="/reyting">Reyting</a>
  </div>
  <a href="https://t.me/BilliardKingBot" class="nav-cta" target="_blank">Bot → Ulash</a>
  <button class="nav-burger" id="burger"><span></span><span></span><span></span></button>
</nav>
<div class="nav-mobile" id="nav-mobile">
  <a href="/turnirlar">🏆 Turnirlar</a>
  <a href="/shop">🛒 Do'kon</a>
  <a href="/jamiyat">👥 Jamiyat</a>
  <a href="/reyting">🎯 Reyting</a>
  <a href="https://t.me/BilliardKingBot" target="_blank">✈️ Botga Ulash</a>
</div>

<div class="page-hero">
  <div class="ph-inner">
    <div>
      <div class="ph-eye">Barcha Turnirlar</div>
      <h1 class="ph-title">Turnirlar</h1>
      <p class="ph-sub">Faol va yakunlangan turnirlar. Real-time natijalar.</p>
    </div>
    <div class="ph-badge">
      <strong id="upd">—</strong>
      Oxirgi yangilanish
    </div>
  </div>
</div>

<main class="main" id="main">
  <div class="loader"><div class="spin"></div>Yuklanmoqda…</div>
</main>

<footer>
  <div class="foot-logo"><img src="/logo.jpg" alt="Billiard King"></div>
  <div class="foot-r">© 2026 Billiard King · billiardking.uz</div>
</footer>

<script>
const bg = document.getElementById('burger'), nm = document.getElementById('nav-mobile');
bg.addEventListener('click', () => { bg.classList.toggle('open'); nm.classList.toggle('open'); });
nm.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { bg.classList.remove('open'); nm.classList.remove('open'); }));

const API = '/api';

async function load() {
  try {
    const r = await fetch(API + '/tournaments');
    if (!r.ok) throw new Error(r.status);
    const all = await r.json() || [];
    render(all);
    document.getElementById('upd').textContent = new Date().toLocaleTimeString('uz-UZ');
  } catch(e) {
    document.getElementById('main').innerHTML = '<div class="empty"><span class="ico">⚠️</span>Serverga ulanib bo\'lmadi</div>';
  }
}

function render(all) {
  const active   = all.filter(t => t.status === 'registration' || t.status === 'in_progress');
  const finished = all.filter(t => t.status === 'finished' || t.status === 'cancelled');
  active.sort((a,b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
  finished.sort((a,b) => new Date(b.scheduled_at) - new Date(a.scheduled_at));
  const main = document.getElementById('main');
  main.innerHTML = '';
  if (!all.length) { main.innerHTML = '<div class="empty"><span class="ico">🏆</span>Hozircha turnirlar yo\'q</div>'; return; }
  if (active.length)   { main.appendChild(mkSec('⚡ Faol turnirlar'));   main.appendChild(mkCards(active)); }
  if (finished.length) { main.appendChild(mkSec('📋 Turnirlar tarixi')); main.appendChild(mkCards(finished)); }
}

function mkSec(title) {
  const d = document.createElement('div');
  d.className = 'sec-title';
  d.innerHTML = title + '<span class="line"></span>';
  return d;
}
function mkCards(list) {
  const g = document.createElement('div'); g.className = 'cards';
  for (const t of list) g.appendChild(mkCard(t));
  return g;
}
function mkCard(t) {
  const a = document.createElement('a');
  a.href = '/turnir/' + t.id;
  const isActive = t.status === 'registration' || t.status === 'in_progress';
  a.className = 'card ' + (isActive ? 'active' : 'finished');
  const pct = t.max_players > 0 ? Math.min(100, Math.round((t.approved_count / t.max_players) * 100)) : 0;
  a.innerHTML =
    '<div class="card-top"><div class="card-name">' + esc(t.name) + '</div>' + badge(t.status) + '</div>' +
    '<div class="card-meta">' +
      (t.branch_name ? '<span class="tag">📍 ' + esc(t.branch_name) + '</span>' : '') +
      '<span class="tag">📅 ' + fmtDate(t.scheduled_at) + '</span>' +
      '<span class="tag">' + typeIco(t.type) + ' ' + typeName(t.type) + '</span>' +
    '</div>' +
    '<div class="card-footer"><div class="bar-wrap"><div class="bar-lbl">O\'yinchilar</div><div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div></div>' +
    '<span class="pcount">' + (t.approved_count||0) + '/' + (t.max_players||0) + '</span>' +
    '<span class="arr">›</span></div>';
  return a;
}
function badge(s) {
  const m = {registration:['b-reg',"📋 Ro'yxat"],in_progress:['b-live','⚡ Jarayonda'],finished:['b-done','🏆 Yakunlandi'],cancelled:['b-cancel','❌ Bekor']};
  const [cls, lbl] = m[s] || ['b-done', s];
  return '<span class="badge ' + cls + '">' + lbl + '</span>';
}
function typeIco(t){return{single_elimination:'🎯',double_elimination:'🔄',round_robin:'🔁'}[t]||'🏆'}
function typeName(t){return{single_elimination:'Single',double_elimination:'Double',round_robin:'Round Robin'}[t]||t||''}
function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

load();

let _retryMs = 2000, _sse = null;
function connectSSE() {
  if (_sse) { _sse.close(); _sse = null; }
  _sse = new EventSource(API + '/tournaments/sse');
  _sse.onopen = () => { _retryMs = 2000; };
  _sse.onmessage = e => { try { const m = JSON.parse(e.data); if (m.type === 'refresh') load(); } catch(x) {} };
  _sse.onerror = () => { _sse.close(); _sse = null; setTimeout(connectSSE, _retryMs); _retryMs = Math.min(_retryMs * 2, 30000); };
}
connectSSE();
</script>
</body>
</html>
