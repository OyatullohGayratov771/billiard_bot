<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Turnirlar — Billiard King</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#D4AF37;--gold-l:#F0D878;
  --bg:#0A0A0A;--card:#131313;--card2:#1A1A1A;
  --border:rgba(212,175,55,.15);--border2:rgba(212,175,55,.07);
  --text:#F2F2F2;--text2:#888;--text3:#444;
  --green:#2ECC71;--red:#E74C3C;--blue:#3498DB;--orange:#E67E22;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{text-decoration:none;color:inherit}

.nav{position:sticky;top:0;z-index:50;background:rgba(5,5,5,.97);border-bottom:1px solid var(--border2);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px}
.nav-logo{font-size:.82rem;font-weight:900;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.nav-live{display:flex;align-items:center;gap:6px;font-size:.62rem;color:var(--text3)}
.live-dot{width:6px;height:6px;border-radius:50%;background:#333}
.live-dot.on{background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.hero{padding:24px 20px 0;max-width:640px;margin:0 auto}
.hero h1{font-size:1.5rem;font-weight:900;letter-spacing:-.5px}
.hero p{font-size:.75rem;color:var(--text2);margin-top:5px}

.filters{padding:14px 20px 0;max-width:640px;margin:0 auto;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border2);color:var(--text3);background:none;white-space:nowrap;transition:.2s;font-family:inherit}
.chip.on{background:rgba(212,175,55,.1);color:var(--gold);border-color:rgba(212,175,55,.35)}
.cnt{font-size:.55rem;opacity:.7;margin-left:3px}

.list{padding:14px 20px 60px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}

.tc{background:var(--card);border:1px solid var(--border2);border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s;display:block}
.tc:hover{border-color:rgba(212,175,55,.3);transform:translateY(-1px)}
.tc:active{transform:none}
.tc-top{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tc-name{font-size:.92rem;font-weight:800;flex:1;line-height:1.3;color:var(--text)}
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:.56rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border:1px solid;flex-shrink:0}
.st-reg{background:rgba(212,175,55,.08);color:var(--gold);border-color:rgba(212,175,55,.25)}
.st-prog{background:rgba(46,204,113,.08);color:var(--green);border-color:rgba(46,204,113,.25)}
.st-fin{background:rgba(52,152,219,.08);color:var(--blue);border-color:rgba(52,152,219,.2)}
.st-can{background:rgba(68,68,68,.08);color:#555;border-color:#1e1e1e}
.tc-meta{padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:8px;font-size:.64rem;color:var(--text2)}
.tc-meta span{display:inline-flex;align-items:center;gap:3px}
.type-badge{font-size:.52rem;background:rgba(52,152,219,.08);color:var(--blue);border:1px solid rgba(52,152,219,.18);padding:2px 7px;border-radius:8px;font-weight:700}
.tc-foot{padding:9px 16px;border-top:1px solid var(--border2);display:flex;align-items:center;gap:10px}
.slots-bar{flex:1;height:3px;background:var(--card2);border-radius:2px;overflow:hidden}
.slots-fill{height:100%;background:var(--gold);border-radius:2px}
.slots-fill.full{background:var(--red)}
.slots-txt{font-size:.6rem;color:var(--text3);white-space:nowrap}
.arr{color:var(--text3);font-size:.95rem}

.empty{padding:60px 0;text-align:center;color:var(--text3);font-size:.82rem;line-height:2.2}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200%;animation:sk 1.4s infinite;border-radius:10px;height:104px;margin-bottom:8px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

.foot{padding:14px 20px;text-align:center;font-size:.62rem;color:var(--text3);border-top:1px solid var(--border2);max-width:640px;margin:0 auto}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/">👑 Billiard King</a>
  <div class="nav-live">
    <div class="live-dot" id="ldot"></div>
    <span id="lstatus">Ulanmoqda</span>
  </div>
</nav>

<div class="hero">
  <h1>🏆 Turnirlar</h1>
  <p>Barcha musobaqalar — ro'yxat, jarayon va natijalar</p>
</div>

<div class="filters">
  <button class="chip on" data-f="all">Barchasi <span class="cnt" id="c-all"></span></button>
  <button class="chip" data-f="in_progress">Jarayonda <span class="cnt" id="c-prog"></span></button>
  <button class="chip" data-f="registration">Ro'yxat <span class="cnt" id="c-reg"></span></button>
  <button class="chip" data-f="finished">Yakunlandi <span class="cnt" id="c-fin"></span></button>
</div>

<div class="list" id="list">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
</div>

<div class="foot">🎱 billiardking.uz</div>

<script>
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const STATUS_CLS = {registration:'st-reg',in_progress:'st-prog',finished:'st-fin',cancelled:'st-can'};
const STATUS_LBL = {registration:'Ro\'yxat',in_progress:'Jarayonda',finished:'Yakunlandi',cancelled:'Bekor'};
const TYPE_LBL   = {single_elimination:'SE',double_elimination:'DE',round_robin:'RR'};

function fmtDT(s) {
  if (!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'2-digit'})
       + ' ' + d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});
}

let all = [], filter = 'all';

function render() {
  const list = filter === 'all' ? all : all.filter(t => t.status === filter);
  const el = document.getElementById('list');
  if (!list.length) {
    el.innerHTML = '<div class="empty">🏆<br>Bu bo\'limda turnirlar yo\'q</div>';
    return;
  }
  el.innerHTML = list.map(t => {
    const cnt  = t.approved_count || 0;
    const fill = Math.min(100, Math.round((cnt / t.max_players) * 100));
    const full = cnt >= t.max_players;
    return `<a class="tc" href="/turnir/${t.id}">
      <div class="tc-top">
        <div class="tc-name">${esc(t.name)}</div>
        <span class="st ${STATUS_CLS[t.status]||'st-can'}">${STATUS_LBL[t.status]||t.status}</span>
      </div>
      <div class="tc-meta">
        <span>📅 ${fmtDT(t.scheduled_at)}</span>
        ${t.branch_name?`<span>🏢 ${esc(t.branch_name)}</span>`:''}
        ${t.price>0?`<span>💰 ${t.price.toLocaleString()} so'm</span>`:'<span>🆓 Bepul</span>'}
        <span class="type-badge">${TYPE_LBL[t.type]||'SE'}</span>
      </div>
      <div class="tc-foot">
        <div class="slots-bar"><div class="slots-fill${full?' full':''}" style="width:${fill}%"></div></div>
        <div class="slots-txt">${cnt}/${t.max_players} o'rin</div>
        <div class="arr">›</div>
      </div>
    </a>`;
  }).join('');
}

function counts() {
  document.getElementById('c-all').textContent  = all.length||'';
  document.getElementById('c-prog').textContent = all.filter(t=>t.status==='in_progress').length||'';
  document.getElementById('c-reg').textContent  = all.filter(t=>t.status==='registration').length||'';
  document.getElementById('c-fin').textContent  = all.filter(t=>t.status==='finished').length||'';
}

async function load() {
  try {
    const r = await fetch('/api/tournaments');
    if (!r.ok) throw 0;
    all = (await r.json() || []).sort((a,b) => {
      const o = {in_progress:0,registration:1,finished:2,cancelled:3};
      return (o[a.status]||9)-(o[b.status]||9);
    });
    counts(); render();
  } catch(_) {
    document.getElementById('list').innerHTML = '<div class="empty">❌<br>Yuklab bo\'lmadi</div>';
  }
}

document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    filter = c.dataset.f;
    render();
  });
});

// SSE
let sse, retry = 2000;
function connect() {
  sse = new EventSource('/api/tournaments/sse');
  sse.onopen = () => {
    retry = 2000;
    document.getElementById('ldot').classList.add('on');
    document.getElementById('lstatus').textContent = 'Jonli';
  };
  sse.onmessage = e => {
    try { if (JSON.parse(e.data).type === 'refresh') load(); } catch(_){}
  };
  sse.onerror = () => {
    document.getElementById('ldot').classList.remove('on');
    document.getElementById('lstatus').textContent = 'Uzildi';
    sse.close();
    setTimeout(connect, retry);
    retry = Math.min(retry*2, 30000);
  };
}

load();
connect();
</script>
</body>
</html>
