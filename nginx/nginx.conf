worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    # ── Timeout & request size limits ──
    keepalive_timeout           30s;
    client_max_body_size        2m;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                15s;
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Rate limit zonalar ──
    limit_req_zone $binary_remote_addr zone=tv:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=web:10m  rate=20r/s;
    limit_req_status 429;

    # ── Docker DNS ──
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80 default_server;
        server_name _;
        access_log off;
        return 301 https://billiardking.uz$request_uri;
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;
        server_name billiardking.uz www.billiardking.uz;

        # ── TLS ──
        ssl_certificate     /etc/letsencrypt/live/billiardking.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/billiardking.uz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;


        # ── Xavfsizlik sarlavhalari ──
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-XSS-Protection          "1; mode=block"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'self' https://web.telegram.org; base-uri 'self'; form-action 'self';" always;

        # Ichki ma'lumotni yashirish
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header X-Internal-Token;

        # ── Zararli bot va skanerlarni bloklash ──
        if ($http_user_agent = "") { return 444; }
        if ($http_user_agent ~* "(l9scan|masscan|zgrab|nmap|nikto|sqlmap|havij|acunetix|nessus|openvas|w3af|skipfish|dirbuster|gobuster|nuclei|hydra|medusa|httpscan|python-requests/2\.6|Go-http-client/1\.1)") {
            return 444;
        }

        # ── Exploit urinishlari → 444 ──
        location ~* "\.(php|asp|aspx|jsp|cgi|env|sql|bak|sh|rb|pl|htaccess|htpasswd|DS_Store)$" {
            access_log off;
            return 444;
        }
        location ~* "^/(wp-admin|wp-content|wp-includes|phpmyadmin|cgi-bin|xmlrpc|\.git|\.env|\.svn|admin|backup|config|install|setup|shell|cmd|eval)" {
            access_log off;
            return 444;
        }
        location ~* "\.\." {
            access_log off;
            return 444;
        }

        # ── TV bracket + SSE (WebSocket) ──
        location /tv/ {
            limit_req zone=tv burst=50 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }

            set $upstream http://tournament-service:8084;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering                    off;
            proxy_cache                        off;
            proxy_read_timeout                 3600s;
            proxy_send_timeout                 3600s;
            proxy_set_header X-Accel-Buffering no;
        }

        # ── Global SSE (turnirlar ro'yxati) ──
        location = /api/tournaments/sse {
            if ($request_method != GET) { return 405; }

            set $upstream http://tournament-service:8084;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
            proxy_buffering                    off;
            proxy_cache                        off;
            proxy_read_timeout                 3600s;
            proxy_send_timeout                 3600s;
            proxy_set_header X-Accel-Buffering no;
        }

        # ── Bracket SSE ──
        location ~ ^/api/tournaments/([0-9]+)/sse$ {
            if ($request_method != GET) { return 405; }

            set $trn_id $1;
            set $upstream http://tournament-service:8084;
            proxy_pass $upstream/tournaments/$trn_id/sse;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Connection        "";
            proxy_buffering                    off;
            proxy_cache                        off;
            proxy_read_timeout                 3600s;
            proxy_send_timeout                 3600s;
            proxy_set_header X-Accel-Buffering no;
        }

        # ── Web auth + user/admin API ──
        location /api/auth/ {
            limit_req zone=api burst=20 nodelay;
            if ($request_method !~ ^(GET|POST)$) { return 405; }
            set $upstream http://web-service:8085;
            rewrite ^/api/auth/(.*)$ /api/auth/$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/me/ {
            limit_req zone=api burst=30 nodelay;
            if ($request_method !~ ^(GET|POST|PUT)$) { return 405; }
            set $upstream http://web-service:8085;
            rewrite ^/api/me/(.*)$ /api/me/$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
        }
        location = /api/me {
            limit_req zone=api burst=30 nodelay;
            if ($request_method !~ ^(GET)$) { return 405; }
            set $upstream http://web-service:8085;
            proxy_pass $upstream/api/me;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
        }
        location /api/admin/ {
            limit_req zone=api burst=30 nodelay;
            if ($request_method !~ ^(GET|POST|PUT)$) { return 405; }
            set $upstream http://web-service:8085;
            rewrite ^/api/admin/(.*)$ /api/admin/$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header Authorization     $http_authorization;
        }

        # ── Public API (faqat GET/POST/PUT) ──
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            if ($request_method !~ ^(GET|POST|PUT)$) { return 405; }

            set $upstream http://tournament-service:8084;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            access_log off;

            set $upstream http://tournament-service:8084;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Statik fayllar (rasm, ico) — uzoq kesh ──
        location ~* "\.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2)$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            expires 7d;
            access_log off;
        }

        location = /favicon.ico {
            access_log off;
            return 204;
        }

        location = /robots.txt {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            access_log off;
            expires 1d;
        }

        # ── Autentifikatsiya sahifalari ──
        location = /me {
            limit_req zone=web burst=30 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            try_files /me.html =404;
            expires -1;
        }
        location = /panel {
            limit_req zone=web burst=30 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            try_files /panel.html =404;
            expires -1;
        }

        # ── Sahifalar (har biri alohida) ──
        location = /turnirlar {
            limit_req zone=web burst=30 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            try_files /turnirlar.html =404;
            expires -1;
        }
        location ~ ^/turnir/[0-9]+$ {
            limit_req zone=web burst=30 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            try_files /tournament.html =404;
            expires -1;
        }
        location = /shop {
            limit_req zone=web burst=30 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            try_files /shop.html =404;
            expires -1;
        }
        location = /jamiyat {
            limit_req zone=web burst=30 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            try_files /jamiyat.html =404;
            expires -1;
        }
        location = /reyting {
            limit_req zone=web burst=30 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            root /var/www/panel;
            try_files /reyting.html =404;
            expires -1;
        }

        # ── Bosh sahifa ──
        location / {
            limit_req zone=web burst=50 nodelay;
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }

            root /var/www/panel;
            index index.html;
            try_files $uri $uri/ =404;
            autoindex off;
            expires -1;
        }
    }
}
