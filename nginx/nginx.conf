worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=tv:10m rate=20r/s;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80;
        server_name billiardking.uz www.billiardking.uz;
        access_log off;
        return 301 https://billiardking.uz$request_uri;
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;
        server_name billiardking.uz www.billiardking.uz;

        ssl_certificate     /etc/letsencrypt/live/billiardking.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/billiardking.uz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # TV bracket + SSE
        location /tv/ {
            limit_req zone=tv burst=50 nodelay;

            set $upstream http://tournament-service:8084;
            proxy_pass $upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection        "";
            proxy_buffering                    off;
            proxy_cache                        off;
            proxy_read_timeout                 3600s;
            proxy_send_timeout                 3600s;
            chunked_transfer_encoding          on;
            proxy_set_header X-Accel-Buffering no;
        }

        location /health {
            set $upstream http://tournament-service:8084;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            access_log off;
            return 444;
        }
    }
}
