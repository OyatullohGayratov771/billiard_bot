worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # Rate limiting (DDoS himoya)
    limit_req_zone $binary_remote_addr zone=tv:10m rate=20r/s;

    # Upstream — tournament-service
    upstream tournament {
        server tournament-service:8084;
        keepalive 32;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS — asosiy server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        # ── TV bracket sahifasi (HTML + SSE + JSON) ──
        location /tv/ {
            limit_req zone=tv burst=50 nodelay;

            proxy_pass http://tournament;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE uchun (Connection: keep-alive, chunked)
            proxy_set_header Connection        "";
            proxy_buffering                    off;
            proxy_cache                        off;
            proxy_read_timeout                 3600s;  # SSE uzoq davom etadi
            proxy_send_timeout                 3600s;
            chunked_transfer_encoding          on;

            # nginx buferini o'chirish (SSE real-time uchun muhim)
            proxy_set_header X-Accel-Buffering no;
        }

        # Health check
        location /health {
            proxy_pass http://tournament;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Qolgan barcha so'rovlar — 404
        location / {
            return 404 '{"error":"not found"}';
            add_header Content-Type application/json;
        }
    }
}
