worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json text/html;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=tv:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80 default_server;
        server_name _;
        access_log off;
        return 301 https://billiardking.uz$request_uri;
    }

    # ── HTTPS ──
    server {
        listen 443 ssl;
        server_name billiardking.uz www.billiardking.uz;

        ssl_certificate     /etc/letsencrypt/live/billiardking.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/billiardking.uz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── PHP va exploit urinishlari → 444 ──
        location ~* \.(php|asp|aspx|jsp|cgi|env|sql|bak)$ {
            access_log off;
            return 444;
        }
        location ~* ^/(wp-admin|wp-content|wp-includes|phpmyadmin|cgi-bin|xmlrpc) {
            access_log off;
            return 444;
        }

        # ── TV bracket + SSE ──
        location /tv/ {
            limit_req zone=tv burst=50 nodelay;
            set $upstream http://tournament-service:8084;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_buffering                    off;
            proxy_cache                        off;
            proxy_read_timeout                 3600s;
            proxy_send_timeout                 3600s;
            chunked_transfer_encoding          on;
            proxy_set_header X-Accel-Buffering no;
        }

        # ── Global SSE (turnirlar ro'yxati) ──
        location = /api/tournaments/sse {
            set $upstream http://tournament-service:8084;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection      "";
            proxy_buffering                  off;
            proxy_cache                      off;
            proxy_read_timeout               3600s;
            proxy_send_timeout               3600s;
            chunked_transfer_encoding        on;
            proxy_set_header X-Accel-Buffering no;
        }

        # ── Bracket SSE ──
        location ~ ^/api/tournaments/[0-9]+/sse$ {
            set $upstream http://tournament-service:8084;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection      "";
            proxy_buffering                  off;
            proxy_cache                      off;
            proxy_read_timeout               3600s;
            proxy_send_timeout               3600s;
            chunked_transfer_encoding        on;
            proxy_set_header X-Accel-Buffering no;
        }

        # ── Public API ──
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            set $upstream http://tournament-service:8084;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Internal-Token;
        }

        location /health {
            set $upstream http://tournament-service:8084;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Web panel ──
        location / {
            root /var/www/panel;
            index index.html;
            try_files $uri $uri/ /index.html;

            if ($http_user_agent ~* "(l9scan|masscan|zgrab|nmap|nikto|sqlmap)") {
                access_log off;
                return 444;
            }
        }
    }
}
