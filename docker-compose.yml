services:
  postgres:
    image: postgres:15
    container_name: billiard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-billiard_bot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10

  table-service:
    build:
      context: ./table-service
      dockerfile: Dockerfile
    container_name: billiard_table_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_DSN: "host=postgres port=5432 user=${DB_USER:-postgres} password=${DB_PASSWORD:-postgres} dbname=${DB_NAME:-billiard_bot} sslmode=disable"
      TABLE_SERVICE_PORT: "8082"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: billiard_user_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      table-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_DSN: "host=postgres port=5432 user=${DB_USER:-postgres} password=${DB_PASSWORD:-postgres} dbname=${DB_NAME:-billiard_bot} sslmode=disable"
      USER_SERVICE_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  clip-service:
    build:
      context: ./clip-service
      dockerfile: Dockerfile
    container_name: billiard_clip_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      table-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_DSN: "host=postgres port=5432 user=${DB_USER:-postgres} password=${DB_PASSWORD:-postgres} dbname=${DB_NAME:-billiard_bot} sslmode=disable"
      CLIP_SERVICE_PORT: "8083"
      CLIPS_DIR: "/app/clips"
    ports:
      - "8083:8083"
    volumes:
      - clips_data:/app/clips
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: ./bot-gateway
      dockerfile: Dockerfile
    container_name: billiard_bot
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      table-service:
        condition: service_healthy
      clip-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      USER_SERVICE_URL: "http://user-service:8081"
      TABLE_SERVICE_URL: "http://table-service:8082"
      CLIP_SERVICE_URL: "http://clip-service:8083"
    volumes:
      - clips_data:/app/clips

volumes:
  pgdata:
  clips_data:
