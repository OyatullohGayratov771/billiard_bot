<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Turnir Bracket</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06060e;color:#e0e0f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:auto}

/* ── HEADER ── */
.hdr{
  background:linear-gradient(135deg,#0b0b1e 0%,#0f0f28 50%,#0b0b1e 100%);
  border-bottom:2px solid #d4a012;
  padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.hdr-left h1{font-size:clamp(1.1rem,3vw,1.9rem);font-weight:800;color:#f0c030;letter-spacing:.5px;text-shadow:0 0 20px rgba(240,192,48,.3)}
.hdr-left p{font-size:.78rem;color:#7070a0;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.hdr-left p span{background:rgba(255,255,255,.04);border-radius:4px;padding:1px 7px}
.type-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(212,160,18,.12);border:1px solid rgba(212,160,18,.3);border-radius:12px;padding:3px 10px;font-size:.72rem;color:#d4a012;margin-top:5px}
.badge{display:flex;align-items:center;gap:7px;border-radius:20px;padding:7px 14px;font-size:.78rem;white-space:nowrap;border:1px solid #30b030;background:#061206;color:#30c030}
.badge.offline{border-color:#444;color:#666;background:#080808}
.dot{width:7px;height:7px;border-radius:50%;background:#30c030;animation:pulse 1.4s infinite}
.badge.offline .dot{background:#444;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}

/* ── SECTION (DE separators) ── */
.section-wrap{padding:0 0 32px}
.section-hdr{
  display:flex;align-items:center;gap:12px;
  padding:18px 28px 12px;
  font-size:.66rem;text-transform:uppercase;letter-spacing:2.5px;color:#4040a0;font-weight:800;
}
.section-hdr.wb{color:#c0a000}
.section-hdr.lb{color:#5080c0}
.section-hdr.gf{color:#c04080}
.section-hdr::after{content:'';flex:1;height:1px;background:currentColor;opacity:.2}

/* ── BRACKET (SE / WB / LB) ── */
.bracket{display:flex;align-items:stretch;padding:8px 28px 0;gap:0;overflow-x:auto}

.round-col{display:flex;flex-direction:column;align-items:center;min-width:230px}
.round-label{font-size:.63rem;text-transform:uppercase;letter-spacing:2px;color:#404080;margin-bottom:10px;text-align:center;padding:3px 10px;border-radius:4px;background:rgba(64,64,128,.15)}

.matches-col{display:flex;flex-direction:column;width:100%;flex:1}
.match-slot{display:flex;align-items:center;flex:1;min-height:110px;width:100%;padding:9px 0}
.match-slot .sc-card{width:100%;min-width:210px;box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* connector */
.conn{display:flex;flex-direction:column;justify-content:center;width:32px;flex-shrink:0;align-self:stretch}
.conn-line{border-top:1px solid #2a2a50;width:100%}

@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(212,160,18,.3)}50%{box-shadow:0 0 36px rgba(212,160,18,.55)}}

/* ── WINNER COLUMN ── */
.winner-col{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:150px;flex:1;gap:8px;padding:20px}
.trophy{font-size:3.8rem;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(240,192,48,.5))}
.winner-name{font-size:1.3rem;font-weight:800;color:#f0c030;text-align:center;text-shadow:0 0 16px rgba(240,192,48,.4)}
.winner-sub{font-size:.65rem;color:#7070a0;text-transform:uppercase;letter-spacing:2.5px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ── ROUND ROBIN ── */
.rr-wrap{display:grid;grid-template-columns:1fr 280px;gap:24px;padding:12px 28px 40px;min-height:300px}
@media(max-width:780px){.rr-wrap{grid-template-columns:1fr}}

.rr-matches{display:flex;flex-direction:column;gap:8px}
.rr-card{
  border-radius:10px;border:1px solid #1a1a38;
  background:linear-gradient(160deg,#0d0d22,#0a0a1a);
  padding:11px 16px;
  display:flex;align-items:center;gap:12px;
  transition:border-color .2s;
}
.rr-card.live{border-color:#d4a012;animation:glow 2.2s ease-in-out infinite}
.rr-card.done{border-color:#1a2820;background:linear-gradient(160deg,#0c1410,#080e0c)}
.rr-num{font-size:.68rem;color:#404070;min-width:24px;text-align:right}
.rr-vs{color:#303060;font-size:.78rem;margin:0 8px}
.rr-p{font-size:.85rem;font-weight:500}
.rr-p.win{color:#f0c030;font-weight:700}
.rr-p.lose{color:#2e2e56}
.rr-status{margin-left:auto;font-size:.75rem}

.standings{
  border-radius:12px;border:1px solid #1a1a38;
  background:linear-gradient(160deg,#0d0d22,#0a0a1a);
  overflow:hidden;
  height:fit-content;
}
.standings-hdr{
  padding:12px 16px;
  font-size:.68rem;text-transform:uppercase;letter-spacing:2px;color:#6060a0;
  border-bottom:1px solid #1a1a38;
  background:rgba(255,255,255,.02);
}
.standings-row{
  display:grid;grid-template-columns:28px 1fr 36px 36px 36px;
  align-items:center;gap:8px;
  padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.04);
  font-size:.84rem;
  transition:background .15s;
}
.standings-row:last-child{border-bottom:none}
.standings-row:hover{background:rgba(255,255,255,.03)}
.standings-row.first{background:rgba(212,160,18,.07)}
.standings-row.first .s-name{color:#f0c030;font-weight:700}
.s-rank{color:#404080;font-weight:700;font-size:.75rem}
.s-rank.r1{color:#f0c030}
.s-rank.r2{color:#c0c0c0}
.s-rank.r3{color:#c08060}
.s-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-num{text-align:center;color:#6060a0;font-size:.8rem}
.s-num.w{color:#30c060;font-weight:700}

/* ── GRAND FINAL (DE) ── */
.gf-wrap{
  display:flex;align-items:center;justify-content:center;
  padding:20px 28px 40px;gap:20px;
}
.gf-label{
  font-size:.68rem;text-transform:uppercase;letter-spacing:2px;
  color:#c04080;margin-bottom:8px;text-align:center;
}

/* ── EMPTY / OVERLAY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:#282858;font-size:.95rem;text-align:center;padding:60px 40px;min-height:200px}
.empty .big{font-size:2.8rem;filter:grayscale(1);opacity:.5}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.overlay.on{opacity:1}
.spinner{width:42px;height:42px;border:3px solid #181830;border-top-color:#f0c030;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FOOTER ── */
.foot{position:fixed;bottom:0;left:0;right:0;background:#04040c;border-top:1px solid #101024;padding:6px 22px;display:flex;justify-content:space-between;font-size:.68rem;color:#282850}

/* ── TABS ── */
.tv-tabs{display:flex;gap:0;border-bottom:2px solid #12122a;background:#07070f;padding:0 24px}
.tv-tab{padding:10px 22px;font-size:.78rem;font-weight:600;letter-spacing:.5px;cursor:pointer;border:none;background:none;color:#404070;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s}
.tv-tab:hover{color:#7070c0}
.tv-tab.active{color:#f0c030;border-bottom-color:#f0c030}

/* ── TABLE VIEW ── */
.tbl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:20px 24px 60px}
.tbl-card{border-radius:12px;overflow:hidden;border:1px solid #1a1a38;background:linear-gradient(160deg,#0d0d22,#0a0a1a)}
.tbl-card.tbl-active{border-color:#d4a012;box-shadow:0 0 20px rgba(212,160,18,.25)}
.tbl-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(255,255,255,.03);border-bottom:1px solid #12122a}
.tbl-num{font-size:.9rem;font-weight:800;color:#f0c030}
.tbl-status{font-size:.68rem;color:#404070;letter-spacing:1px;display:flex;align-items:center;gap:5px}
.tbl-status.is-active{color:#30c060}
.tbl-live-dot{width:6px;height:6px;border-radius:50%;background:#30c060;animation:pulse 1.4s infinite;display:inline-block}
.tbl-match{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
.tbl-match:last-child{border-bottom:none}
.tbl-match.tbl-match-live{background:rgba(212,160,18,.06)}
.tbl-match.tbl-match-done{opacity:.8}
.tbl-round{font-size:.6rem;color:#303060;margin-bottom:5px;letter-spacing:1px;text-transform:uppercase}
.tbl-players{display:flex;flex-direction:column;gap:4px}
.tbl-player{font-size:.84rem;font-weight:500;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-player.win{color:#f0c030;font-weight:700}
.tbl-player.lose{color:#2a2a52}
.tbl-vs{font-size:.65rem;color:#282850;text-align:center}
.queue-list{padding:8px 24px 20px;display:flex;flex-direction:column;gap:6px}
.queue-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid #12122a;font-size:.84rem}
.queue-num{color:#303060;min-width:22px;font-size:.7rem}
.queue-p{color:#5050a0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue-vs{color:#282850;font-size:.68rem}

/* ── SCHEDULE CARD VIEW ── */
.sched-wrap{padding:16px 22px 60px;display:flex;flex-direction:column;gap:0}
.sched-round-lbl{font-size:.56rem;text-transform:uppercase;letter-spacing:2.5px;color:#3a3a70;font-weight:700;margin:14px 2px 7px}
.sched-round-lbl:first-child{margin-top:0}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:6px}
.sc-card{border-radius:10px;overflow:hidden;border:1px solid #15153a;background:linear-gradient(160deg,#0d0d22,#0a0a1a)}
.sc-card.sc-ready{border-color:rgba(212,160,18,.35)}
.sc-card.sc-active{border-color:rgba(212,160,18,.55);background:rgba(212,160,18,.06);animation:glow 2.2s ease-in-out infinite}
.sc-card.sc-done{opacity:.6}
.sc-head{display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}
.sc-mnum{font-size:.72rem;font-weight:800;color:#f0c030;min-width:24px}
.sc-tbl-b{font-size:.68rem;font-weight:800;color:#a0b0e0;background:rgba(100,130,220,.12);padding:1px 7px;border-radius:3px}
.sc-time-b{font-size:.65rem;color:#d4a012;font-weight:700;margin-left:auto;white-space:nowrap}
.sc-player{display:flex;align-items:center;gap:10px;padding:10px 13px;font-size:.88rem}
.sc-player+.sc-player{border-top:1px solid rgba(255,255,255,.05)}
.sc-player.sc-win-row{background:rgba(212,160,18,.1)}
.sc-player.sc-lose-row{opacity:.4}
.sc-pname{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c0c0e0}
.sc-pname.win{color:#f0c030}
.sc-score{font-size:.8rem;color:#303060;min-width:22px;text-align:center;font-weight:700}
.sc-score.win{color:#f0c030}

/* ── MOBILE ── */
@media(max-width:700px){
  .bracket{flex-direction:column;padding:8px 12px 0}
  .round-col{min-width:unset;width:100%}
  .matches-col{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:8px}
  .match-slot{flex-shrink:0}
  .conn{display:none}
  .section-hdr{padding:14px 14px 8px}
  .gf-wrap{padding:12px 14px 40px}
  .rr-wrap{padding:12px 14px 40px}
  .tbl-grid{grid-template-columns:1fr;padding:12px 12px 60px}
  .sched-wrap{padding:10px 12px 60px}
  .sc-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="overlay" id="ov"><div class="spinner"></div></div>

<header class="hdr">
  <div class="hdr-left">
    <h1 id="tname">🏆 Yuklanmoqda…</h1>
    <p id="tmeta"></p>
    <div id="ttype" class="type-pill" style="display:none"></div>
  </div>
  <div class="badge" id="badge">
    <span class="dot" id="dot"></span>
    <span id="btext">Ulanmoqda…</span>
  </div>
</header>

<nav class="tv-tabs">
  <button class="tv-tab active" data-tab="bracket" onclick="switchTab('bracket')">🏆 Bracket</button>
  <button class="tv-tab" data-tab="jadval" id="tab-jadval" style="display:none" onclick="switchTab('jadval')">📋 Jadval</button>
  <button class="tv-tab" data-tab="tables" id="tab-tables" style="display:none" onclick="switchTab('tables')">🎱 Stollar</button>
</nav>

<div id="main">
  <div class="empty"><div class="big">⏳</div><div>Bracket yuklanmoqda…</div></div>
</div>

<footer class="foot">
  <span id="upd">—</span>
  <span>🎱 Billiard King</span>
</footer>

<script>
const TOKEN   = '{{TOKEN}}';
const dataURL = '/tv/' + TOKEN + '/data';
const sseURL  = '/tv/' + TOKEN + '/sse';

let currentData = null;
let activeTab = 'bracket';

/* ── SSE ── */
let sse, retryMs = 1500;
function connectSSE() {
  sse = new EventSource(sseURL);
  sse.onopen = () => { retryMs = 1500; setBadge(true); };
  sse.onmessage = e => {
    try { const m = JSON.parse(e.data); if (m.type === 'refresh') loadData(); } catch(_){}
  };
  sse.onerror = () => {
    setBadge(false); sse.close();
    setTimeout(connectSSE, retryMs);
    retryMs = Math.min(retryMs * 2, 30000);
  };
}
function setBadge(on) {
  const b = document.getElementById('badge');
  const d = document.getElementById('dot');
  const t = document.getElementById('btext');
  b.className = 'badge' + (on ? '' : ' offline');
  d.style.animation = on ? '' : 'none';
  d.style.background = on ? '#30c030' : '#444';
  t.textContent = on ? 'JONLI' : 'Uzildi…';
}

/* ── DATA ── */
async function loadData() {
  const ov = document.getElementById('ov');
  ov.className = 'overlay on';
  try {
    const r = await fetch(dataURL);
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
    document.getElementById('upd').textContent = 'Yangilandi: ' + new Date().toLocaleTimeString('uz-UZ');
  } catch(e) { console.error('load', e); }
  finally { ov.className = 'overlay'; }
}

/* ── TAB SWITCH ── */
function switchTab(name) {
  activeTab = name;
  document.querySelectorAll('.tv-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === name);
  });
  renderActiveTab();
}

/* ── RENDER ROUTER ── */
function render(data) {
  currentData = data;
  const t = data.tournament || {};
  const matches = data.matches || [];

  // Header
  document.getElementById('tname').textContent = '🏆 ' + (t.name || '—');
  document.title = '🏆 ' + (t.name || 'Bracket');

  const meta = document.getElementById('tmeta');
  meta.innerHTML = '';
  if (t.branch_name) { const s=document.createElement('span'); s.textContent='📍 '+t.branch_name; meta.appendChild(s); }
  if (t.scheduled_at){ const s=document.createElement('span'); s.textContent='📅 '+fmtDate(t.scheduled_at); meta.appendChild(s); }
  const ss=document.createElement('span'); ss.textContent=statusLabel(t.status); meta.appendChild(ss);
  if (t.approved_count!=null){ const s=document.createElement('span'); s.textContent='👥 '+t.approved_count+'/'+t.max_players; meta.appendChild(s); }

  const tp = document.getElementById('ttype');
  const typeInfo = typeLabel(t.type);
  if (typeInfo) { tp.textContent = typeInfo; tp.style.display = 'inline-flex'; }
  else tp.style.display = 'none';

  // Show/hide tabs
  const hasTables = matches.some(m => m.table_num > 0);
  const tablesTab = document.getElementById('tab-tables');
  const jadvalTab = document.getElementById('tab-jadval');
  if (tablesTab) tablesTab.style.display = hasTables ? '' : 'none';
  if (jadvalTab) jadvalTab.style.display = matches.length ? '' : 'none';
  if (!hasTables && activeTab === 'tables') activeTab = 'bracket';
  if (!matches.length && activeTab === 'jadval') activeTab = 'bracket';

  // Sync tab highlight
  document.querySelectorAll('.tv-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === activeTab);
  });

  renderActiveTab();
}

function renderActiveTab() {
  if (!currentData) return;
  const t = currentData.tournament || {};
  const matches = currentData.matches || [];
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (!matches.length) {
    main.innerHTML = '<div class="empty"><div class="big">⏳</div><div>Bracket hali yaratilmagan</div></div>';
    return;
  }

  if (activeTab === 'tables') {
    renderTablesView(main, t, matches);
  } else if (activeTab === 'jadval') {
    renderScheduleView(main, t, matches);
  } else if (t.type === 'double_elimination') renderDE(main, t, matches);
  else if (t.type === 'round_robin')   renderRR(main, t, matches);
  else                                 renderSE(main, t, matches);
}

/* ══════════════════════════════════════════
   SINGLE ELIMINATION
══════════════════════════════════════════ */
function renderSE(container, t, matches) {
  const rounds = groupByRound(matches);
  const roundNums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  if (!roundNums.length) return;

  const maxR = roundNums[roundNums.length - 1];

  // find winner
  let winner = null;
  if (t.status === 'finished') {
    for (const m of rounds[maxR] || []) {
      if (m.status === 'done' && m.winner_name) winner = m.winner_name;
    }
  }

  const sec = mkSection('🏆 Bracket', 'wb');

  const br = document.createElement('div');
  br.className = 'bracket';

  roundNums.forEach((r, i) => {
    if (i > 0) br.appendChild(mkConn());
    br.appendChild(mkRoundCol(rounds[r], r === maxR ? 'Final' : r + '-bosqich', r));
  });

  if (t.status === 'finished') {
    br.appendChild(mkConn());
    br.appendChild(mkWinner(winner));
  }

  sec.appendChild(br);
  container.appendChild(sec);
}

/* ══════════════════════════════════════════
   DOUBLE ELIMINATION
══════════════════════════════════════════ */
function renderDE(container, t, matches) {
  const LB_OFFSET = 1000;
  const GF_ROUND  = 2000;

  const wb = matches.filter(m => m.match_type === 'winners');
  const lb = matches.filter(m => m.match_type === 'losers');
  const gf = matches.filter(m => m.match_type === 'grand_final');

  // ── Winners Bracket ──
  if (wb.length) {
    const sec = mkSection('🏆 Winners Bracket', 'wb');
    const rounds = groupByRound(wb);
    const roundNums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    const maxR = roundNums[roundNums.length-1];
    const br = document.createElement('div');
    br.className = 'bracket';
    roundNums.forEach((r,i) => {
      if (i>0) br.appendChild(mkConn());
      br.appendChild(mkRoundCol(rounds[r], r===maxR?'WB Final':'WB R'+r, r));
    });
    sec.appendChild(br);
    container.appendChild(sec);
  }

  // ── Losers Bracket ──
  if (lb.length) {
    const sec = mkSection('⬇ Losers Bracket', 'lb');
    const rounds = groupByRound(lb);
    const roundNums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
    const maxR = roundNums[roundNums.length-1];
    const br = document.createElement('div');
    br.className = 'bracket';
    roundNums.forEach((r,i) => {
      if (i>0) br.appendChild(mkConn());
      const lbR = r - LB_OFFSET;
      const lbl = r===maxR ? 'LB Final' : 'LB R'+lbR;
      br.appendChild(mkRoundCol(rounds[r], lbl, r));
    });
    sec.appendChild(br);
    container.appendChild(sec);
  }

  // ── Grand Final ──
  if (gf.length) {
    const sec = mkSection('🎯 Grand Final', 'gf');
    const gfWrap = document.createElement('div');
    gfWrap.className = 'gf-wrap';
    for (const m of gf) {
      const col = document.createElement('div');
      const lbl = document.createElement('div');
      lbl.className = 'gf-label';
      lbl.textContent = 'Grand Final';
      col.appendChild(lbl);
      col.appendChild(buildCard(m));
      gfWrap.appendChild(col);
    }
    if (t.status === 'finished') {
      let winner = null;
      for (const m of gf) { if (m.status==='done'&&m.winner_name) winner=m.winner_name; }
      gfWrap.appendChild(mkConn());
      gfWrap.appendChild(mkWinner(winner));
    }
    sec.appendChild(gfWrap);
    container.appendChild(sec);
  }

  // Fallback: if match_type fields not populated (old data), use SE logic
  if (!wb.length && !lb.length && !gf.length) {
    renderSE(container, t, matches);
  }
}

/* ══════════════════════════════════════════
   ROUND ROBIN
══════════════════════════════════════════ */
function renderRR(container, t, matches) {
  const wrap = document.createElement('div');
  wrap.className = 'rr-wrap';

  // Left: matches list
  const mList = document.createElement('div');
  mList.className = 'rr-matches';
  const hdr = document.createElement('div');
  hdr.className = 'section-hdr';
  hdr.innerHTML = '⚽ O\'yinlar <span style="font-size:.75rem;text-transform:none;letter-spacing:0;color:#505090">&nbsp;'+matches.length+' ta</span>';
  mList.appendChild(hdr);

  matches.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'rr-card' + (m.status==='ready'?' live':(m.status==='done'?' done':''));
    const done = m.status === 'done';
    const p1win = done && m.winner_slot === 1;
    const p2win = done && m.winner_slot === 2;

    const numEl = document.createElement('span');
    numEl.className = 'rr-num';
    numEl.textContent = (i+1)+'.';

    const p1 = document.createElement('span');
    p1.className = 'rr-p' + (p1win?' win':(done&&!p1win?' lose':''));
    p1.textContent = esc(m.player1_name || '—');

    const vs = document.createElement('span');
    vs.className = 'rr-vs';
    vs.textContent = 'vs';

    const p2 = document.createElement('span');
    p2.className = 'rr-p' + (p2win?' win':(done&&!p2win?' lose':''));
    p2.textContent = esc(m.player2_name || '—');

    const st = document.createElement('span');
    st.className = 'rr-status';
    st.textContent = m.status==='ready'?'🎱':m.status==='done'?'✅':m.status==='pending'?'⏳':'';

    card.appendChild(numEl);
    card.appendChild(p1);
    card.appendChild(vs);
    card.appendChild(p2);
    card.appendChild(st);
    mList.appendChild(card);
  });

  // Right: standings
  const stand = document.createElement('div');
  stand.className = 'standings';
  const shdr = document.createElement('div');
  shdr.className = 'standings-hdr';
  shdr.textContent = 'Jadval';
  stand.appendChild(shdr);

  // compute wins and played — keyed by player name (avoids int64 precision issues)
  const wins = {}, played = {};
  for (const m of matches) {
    if (m.status !== 'done') continue;
    const wname = m.winner_slot===1 ? m.player1_name : m.winner_slot===2 ? m.player2_name : null;
    if (wname) wins[wname] = (wins[wname]||0) + 1;
    if (m.player1_name) played[m.player1_name] = (played[m.player1_name]||0)+1;
    if (m.player2_name) played[m.player2_name] = (played[m.player2_name]||0)+1;
  }
  // collect all players by name
  const playerNames = new Set();
  for (const m of matches) {
    if (m.player1_name) playerNames.add(m.player1_name);
    if (m.player2_name) playerNames.add(m.player2_name);
  }

  const sorted = [...playerNames].map(n => [n, n]).sort((a,b)=>{
    const wa = wins[a[0]]||0;
    const wb2 = wins[b[0]]||0;
    return wb2 - wa;
  });

  // header row
  const hr = document.createElement('div');
  hr.className = 'standings-row';
  hr.style.borderBottom = '1px solid #1a1a38';
  hr.innerHTML = '<span class="s-rank">#</span><span class="s-name" style="color:#404070;font-size:.72rem;letter-spacing:1px">O\'YINCHI</span>' +
    '<span class="s-num" title="O\'ynagan">O</span><span class="s-num" title="G\'alaba">G</span><span class="s-num" title="Mag\'lubiyat">M</span>';
  stand.appendChild(hr);

  sorted.forEach(([name], idx) => {
    const w = wins[name]||0;
    const p = played[name]||0;
    const l = p - w;
    const row = document.createElement('div');
    row.className = 'standings-row' + (idx===0?' first':'');
    const rankClass = idx===0?'r1':idx===1?'r2':idx===2?'r3':'';
    const rankIcon = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'';
    row.innerHTML =
      '<span class="s-rank '+rankClass+'">'+(rankIcon||idx+1)+'</span>'+
      '<span class="s-name">'+esc(name)+'</span>'+
      '<span class="s-num">'+p+'</span>'+
      '<span class="s-num w">'+w+'</span>'+
      '<span class="s-num">'+l+'</span>';
    stand.appendChild(row);
  });

  if (!sorted.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:20px;text-align:center;color:#303060;font-size:.85rem';
    empty.textContent = "O'yinchilar yo'q";
    stand.appendChild(empty);
  }

  wrap.appendChild(mList);
  wrap.appendChild(stand);
  container.appendChild(wrap);
}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function groupByRound(matches) {
  const r = {};
  for (const m of matches) {
    if (!r[m.round]) r[m.round] = [];
    r[m.round].push(m);
  }
  return r;
}

function mkSection(title, cls) {
  const sec = document.createElement('div');
  sec.className = 'section-wrap';
  const hdr = document.createElement('div');
  hdr.className = 'section-hdr ' + cls;
  hdr.textContent = title;
  sec.appendChild(hdr);
  return sec;
}

function mkRoundCol(rmatches, label, round) {
  const col = document.createElement('div');
  col.className = 'round-col';
  const lbl = document.createElement('div');
  lbl.className = 'round-label';
  lbl.textContent = label;
  col.appendChild(lbl);
  const mc = document.createElement('div');
  mc.className = 'matches-col';
  // exponential gap for SE alignment (sc-card height ~80px, base gap scaled)
  const baseGap = 12;
  const effectiveRound = round > 1000 ? round - 1000 : round;
  mc.style.gap = (Math.pow(2, effectiveRound - 1) * baseGap) + 'px';
  for (const m of (rmatches||[])) {
    const slot = document.createElement('div');
    slot.className = 'match-slot';
    slot.appendChild(buildCard(m));
    mc.appendChild(slot);
  }
  col.appendChild(mc);
  return col;
}

function mkConn() {
  const d = document.createElement('div');
  d.className = 'conn';
  d.innerHTML = '<div class="conn-line"></div>';
  return d;
}

function mkWinner(name) {
  const wc = document.createElement('div');
  wc.className = 'winner-col';
  wc.innerHTML =
    '<div class="trophy">🏆</div>'+
    '<div class="winner-name">'+esc(name||'—')+'</div>'+
    '<div class="winner-sub">G\'olib</div>';
  return wc;
}

function buildCard(m) {
  const done  = m.status === 'done';
  const live  = m.status === 'ready';
  const p1win = done && m.winner_slot === 1;
  const p2win = done && m.winner_slot === 2;
  const tblTxt  = m.table_num > 0 ? 'Stol ' + m.table_num : '';
  const timeTxt = m.match_scheduled_at ? fmtMatchDateTime(m.match_scheduled_at) : '';

  if (m.status === 'void') {
    const d = document.createElement('div');
    d.className = 'sc-card'; d.style.opacity = '0.25';
    d.innerHTML =
      '<div class="sc-head"><span class="sc-mnum">#' + m.match_num + '</span></div>' +
      '<div class="sc-player"><span class="sc-pname" style="color:#252550;font-style:italic">Kutilmoqda</span><span class="sc-score">—</span></div>' +
      '<div class="sc-player"><span class="sc-pname" style="color:#252550;font-style:italic">Kutilmoqda</span><span class="sc-score">—</span></div>';
    return d;
  }

  if (m.status === 'bye') {
    const bn = m.player1_name || m.player2_name || '—';
    const d = document.createElement('div');
    d.className = 'sc-card sc-done';
    d.innerHTML =
      '<div class="sc-head"><span class="sc-mnum">#' + m.match_num + '</span><span class="sc-time-b">BYE</span></div>' +
      '<div class="sc-player sc-win-row"><span class="sc-pname win">' + esc(bn) + '</span><span class="sc-score win">🏆</span></div>';
    return d;
  }

  let cardCls = 'sc-card';
  if (live)       cardCls += ' sc-active';
  else if (done)  cardCls += ' sc-done';
  else            cardCls += ' sc-ready';

  const hasScore = done && ((m.player1_score||0) > 0 || (m.player2_score||0) > 0);
  const sc1 = hasScore ? (m.player1_score||0) : done ? (p1win ? '🏆' : '❌') : live ? '🎱' : '—';
  const sc2 = hasScore ? (m.player2_score||0) : done ? (p2win ? '🏆' : '❌') : live ? '🎱' : '—';

  const d = document.createElement('div');
  d.className = cardCls;
  d.innerHTML =
    '<div class="sc-head">' +
      '<span class="sc-mnum">#' + m.match_num + '</span>' +
      (tblTxt ? '<span class="sc-tbl-b">' + tblTxt + '</span>' : '') +
      '<span class="sc-time-b">' + (timeTxt || '—') + '</span>' +
    '</div>' +
    '<div class="sc-player ' + (p1win ? 'sc-win-row' : done && !p1win ? 'sc-lose-row' : '') + '">' +
      '<span class="sc-pname' + (p1win ? ' win' : '') + '">' + (hasScore&&p1win?'🏆 ':'') + esc(m.player1_name || '—') + '</span>' +
      '<span class="sc-score' + (p1win ? ' win' : '') + '">' + sc1 + '</span>' +
    '</div>' +
    '<div class="sc-player ' + (p2win ? 'sc-win-row' : done && !p2win ? 'sc-lose-row' : '') + '">' +
      '<span class="sc-pname' + (p2win ? ' win' : '') + '">' + (hasScore&&p2win?'🏆 ':'') + esc(m.player2_name || '—') + '</span>' +
      '<span class="sc-score' + (p2win ? ' win' : '') + '">' + sc2 + '</span>' +
    '</div>';
  return d;
}

function mkPlayer(name, live, win, lose) {
  const cls = win?' win':lose?' lose':'';
  const ico = win?'🏆':live?'🎱':'👤';
  return '<div class="player'+cls+'"><span class="ico">'+ico+'</span><span class="pname">'+esc(name||'—')+'</span></div>';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+
         d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  // UTC+5 (UZT)
  const uz = new Date(d.getTime() + 5*3600000);
  return String(uz.getUTCHours()).padStart(2,'0') + ':' + String(uz.getUTCMinutes()).padStart(2,'0');
}
function statusLabel(s) {
  return {registration:"📋 Ro'yxat",in_progress:'⚡ Jarayonda',finished:'🏆 Yakunlandi',cancelled:'❌ Bekor'}[s]||s;
}
function typeLabel(t) {
  return {single_elimination:'🎯 Single Elimination',double_elimination:'🔄 Double Elimination',round_robin:'🔁 Round Robin'}[t]||null;
}

/* ══════════════════════════════════════════
   SCHEDULE VIEW (card layout)
══════════════════════════════════════════ */
function fmtMatchDateTime(iso) {
  if (!iso) return '';
  const uz = new Date(new Date(iso).getTime() + 5*3600000);
  const p = n => String(n).padStart(2,'0');
  const yy = String(uz.getUTCFullYear()).slice(2);
  return p(uz.getUTCDate())+'.'+p(uz.getUTCMonth()+1)+'.'+yy+' '+p(uz.getUTCHours())+':'+p(uz.getUTCMinutes());
}

function renderScheduleView(container, t, matches) {
  const LBO = 1000, GF = 2000;

  const visible = matches.filter(m =>
    m.status !== 'bye' && !(m.status === 'void' && !m.player1_name && !m.player2_name)
  );

  if (!visible.length) {
    container.innerHTML = '<div class="empty"><div class="big">📋</div><div>Jadval yo\'q</div></div>';
    return;
  }

  const rounds = {};
  for (const m of visible) {
    if (!rounds[m.round]) rounds[m.round] = [];
    rounds[m.round].push(m);
  }
  const roundNums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);

  const wrap = document.createElement('div');
  wrap.className = 'sched-wrap';

  for (const rn of roundNums) {
    const rmatches = rounds[rn].slice().sort((a,b) => a.match_num - b.match_num);

    let label;
    if (rn === GF)       label = '🏆 Grand Final';
    else if (rn >= LBO+1) label = 'Yutqazuvchilar · R'+(rn-LBO);
    else                  label = 'Raund ' + rn;

    const roundLbl = document.createElement('div');
    roundLbl.className = 'sched-round-lbl';
    roundLbl.textContent = label;
    wrap.appendChild(roundLbl);

    const grid = document.createElement('div');
    grid.className = 'sc-grid';

    for (const m of rmatches) {
      const done  = m.status === 'done';
      const live  = m.status === 'in_progress';
      const ready = m.status === 'ready';
      const w1 = done && m.winner_slot === 1;
      const w2 = done && m.winner_slot === 2;
      const p1 = m.player1_name || '—';
      const p2 = m.player2_name || '—';

      let cardCls = 'sc-card';
      if (live)       cardCls += ' sc-active';
      else if (ready) cardCls += ' sc-ready';
      else if (done)  cardCls += ' sc-done';

      const tblTxt  = m.table_num > 0 ? 'Stol ' + m.table_num : '';
      const timeTxt = fmtMatchDateTime(m.match_scheduled_at);
      const sc1 = done ? (w1 ? '🏆' : '❌') : live ? '▶' : '—';
      const sc2 = done ? (w2 ? '🏆' : '❌') : live ? '▶' : '—';

      const card = document.createElement('div');
      card.className = cardCls;
      card.innerHTML =
        '<div class="sc-head">' +
          '<span class="sc-mnum">#' + m.match_num + '</span>' +
          (tblTxt ? '<span class="sc-tbl-b">' + tblTxt + '</span>' : '') +
          '<span class="sc-time-b">' + (timeTxt || '—') + '</span>' +
        '</div>' +
        '<div class="sc-player ' + (w1 ? 'sc-win-row' : done && !w1 ? 'sc-lose-row' : '') + '">' +
          '<span class="sc-pname' + (w1 ? ' win' : '') + '">' + esc(p1) + '</span>' +
          '<span class="sc-score' + (w1 ? ' win' : '') + '">' + sc1 + '</span>' +
        '</div>' +
        '<div class="sc-player ' + (w2 ? 'sc-win-row' : done && !w2 ? 'sc-lose-row' : '') + '">' +
          '<span class="sc-pname' + (w2 ? ' win' : '') + '">' + esc(p2) + '</span>' +
          '<span class="sc-score' + (w2 ? ' win' : '') + '">' + sc2 + '</span>' +
        '</div>';

      grid.appendChild(card);
    }

    wrap.appendChild(grid);
  }

  container.appendChild(wrap);
}

/* ══════════════════════════════════════════
   TABLE VIEW
══════════════════════════════════════════ */
function renderTablesView(container, t, matches) {
  // Group by table_num; collect unassigned ready/pending as queue
  const tableMap = {};
  const queue = [];

  for (const m of matches) {
    if (m.status === 'void') continue;
    if (m.table_num && m.table_num > 0) {
      if (!tableMap[m.table_num]) tableMap[m.table_num] = [];
      tableMap[m.table_num].push(m);
    } else if (m.status === 'ready' || m.status === 'pending') {
      queue.push(m);
    }
  }

  const tableNums = Object.keys(tableMap).map(Number).sort((a,b)=>a-b);

  if (!tableNums.length && !queue.length) {
    container.innerHTML = '<div class="empty"><div class="big">🎱</div><div>Stollar hali belgilanmagan</div></div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'tbl-grid';

  for (const tn of tableNums) {
    const tMatches = tableMap[tn].slice().sort((a,b)=>{
      const ra = a.round < 1000 ? a.round : a.round - 1000;
      const rb = b.round < 1000 ? b.round : b.round - 1000;
      return ra - rb || a.match_num - b.match_num;
    });

    const activeMatch = tMatches.find(m => m.status === 'ready');

    const card = document.createElement('div');
    card.className = 'tbl-card' + (activeMatch ? ' tbl-active' : '');

    // Header
    const head = document.createElement('div');
    head.className = 'tbl-head';
    const numEl = document.createElement('div');
    numEl.className = 'tbl-num';
    numEl.textContent = tn + '-stol';
    const stEl = document.createElement('div');
    stEl.className = 'tbl-status';
    if (activeMatch) {
      stEl.innerHTML = '<span class="tbl-live-dot"></span> FAOL';
      stEl.classList.add('is-active');
    } else {
      const lastDone = [...tMatches].reverse().find(m => m.status === 'done');
      stEl.textContent = lastDone ? 'Tugan' : 'Kutmoqda';
    }
    head.appendChild(numEl);
    head.appendChild(stEl);
    card.appendChild(head);

    // Match rows (skip pending/bye)
    for (const m of tMatches) {
      if (m.status === 'pending' || m.status === 'bye') continue;
      const done = m.status === 'done';
      const live = m.status === 'ready';
      const w1 = done && m.winner_slot === 1;
      const w2 = done && m.winner_slot === 2;

      const row = document.createElement('div');
      row.className = 'tbl-match' + (live ? ' tbl-match-live' : '') + (done ? ' tbl-match-done' : '');

      const rlbl = document.createElement('div');
      rlbl.className = 'tbl-round';
      const rn = m.round >= 2000 ? 'GF' : m.round >= 1000 ? 'LB R'+(m.round-1000) : 'R'+m.round;
      rlbl.textContent = rn;

      const pl = document.createElement('div');
      pl.className = 'tbl-players';

      const p1 = document.createElement('div');
      p1.className = 'tbl-player' + (w1 ? ' win' : (done ? ' lose' : ''));
      p1.textContent = (w1 ? '🏆 ' : (done ? '❌ ' : (live ? '🎱 ' : ''))) + esc(m.player1_name || '—');

      const vs = document.createElement('div');
      vs.className = 'tbl-vs';
      vs.textContent = 'vs';

      const p2 = document.createElement('div');
      p2.className = 'tbl-player' + (w2 ? ' win' : (done ? ' lose' : ''));
      p2.textContent = (w2 ? '🏆 ' : (done ? '❌ ' : (live ? '🎱 ' : ''))) + esc(m.player2_name || '—');

      pl.appendChild(p1);
      pl.appendChild(vs);
      pl.appendChild(p2);
      row.appendChild(rlbl);
      row.appendChild(pl);
      card.appendChild(row);
    }

    grid.appendChild(card);
  }

  container.appendChild(grid);

  // Queue section
  if (queue.length) {
    const qSec = document.createElement('div');
    qSec.className = 'section-wrap';
    const qHdr = document.createElement('div');
    qHdr.className = 'section-hdr';
    qHdr.textContent = '⏳ Navbatda (' + queue.length + ')';
    qSec.appendChild(qHdr);

    const qList = document.createElement('div');
    qList.className = 'queue-list';

    queue.forEach((m, i) => {
      const row = document.createElement('div');
      row.className = 'queue-row';
      row.innerHTML =
        '<span class="queue-num">'+(i+1)+'.</span>'+
        '<span class="queue-p">'+esc(m.player1_name||'—')+'</span>'+
        '<span class="queue-vs">vs</span>'+
        '<span class="queue-p">'+esc(m.player2_name||'—')+'</span>';
      qList.appendChild(row);
    });

    qSec.appendChild(qList);
    container.appendChild(qSec);
  }
}

loadData();
connectSSE();
